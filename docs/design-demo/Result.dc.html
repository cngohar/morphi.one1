<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Result</title>
		<script src="./support.js"></script>
	</head>
	<body>
		<x-dc>
			<helmet>
				<link
					href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap"
					rel="stylesheet"
				/>
				<style>
					body {
						margin: 0;
					}
					button {
						font-family: inherit;
						cursor: pointer;
					}
				</style>
			</helmet>
			<div
				style="
					width: 390px;
					height: 844px;
					box-sizing: border-box;
					position: relative;
					overflow: hidden;
					background: #f5f8fc;
					font-family: 'Nunito', system-ui, sans-serif;
					color: #1b2433;
				"
			>
				<svg
					width="390"
					height="844"
					viewBox="0 0 390 844"
					aria-hidden="true"
					style="position: absolute; left: 0; top: 0"
				>
					<rect width="390" height="844" fill="#CFD9EA" />
					<rect x="30" y="70" width="78" height="96" rx="16" fill="#B9C9E3" />
					<rect x="130" y="70" width="78" height="96" rx="16" fill="#B9C9E3" />
					<rect x="260" y="700" width="78" height="96" rx="16" fill="#B9C9E3" />
					<rect x="50" y="690" width="78" height="96" rx="16" fill="#B9C9E3" />
				</svg>
				<div
					style="
						position: absolute;
						left: 30px;
						top: 150px;
						width: 330px;
						box-sizing: border-box;
						padding: 28px 24px 24px;
						border-radius: 28px;
						background: #fff;
						box-shadow: 0 18px 40px rgba(27, 36, 51, 0.18);
						text-align: center;
					"
				>
					<span
						style="
							display: inline-block;
							padding: 6px 14px;
							border-radius: 999px;
							background: #fff1d6;
							color: #8a5a00;
							font-weight: 800;
							font-size: 15px;
						"
						>New best</span
					>
					<div style="font-size: 76px; font-weight: 900; line-height: 1.1; margin-top: 8px">
						1,280
					</div>
					<div style="font-size: 16px; font-weight: 700; color: #5a667b">Previous best 1,140</div>
					<div style="font-size: 15px; font-weight: 600; color: #5a667b; margin-top: 4px">
						24 moves, 00:48
					</div>
					<button
						style="
							margin-top: 24px;
							width: 100%;
							height: 64px;
							border: 0;
							border-radius: 20px;
							background: #e5532d;
							color: #fff;
							font-weight: 900;
							font-size: 22px;
							box-shadow: 0 8px 18px rgba(229, 83, 45, 0.3);
						"
					>
						Next puzzle
					</button>
					<div style="display: flex; gap: 12px; margin-top: 12px">
						<button
							style="
								flex: 1;
								height: 48px;
								border-radius: 16px;
								border: 2px solid #d5deec;
								background: #fff;
								color: #1b2433;
								font-weight: 800;
								font-size: 16px;
							"
						>
							Home</button
						><button
							style="
								flex: 1;
								height: 48px;
								border-radius: 16px;
								border: 2px solid #d5deec;
								background: #fff;
								color: #1b2433;
								font-weight: 800;
								font-size: 16px;
							"
						>
							Share
						</button>
					</div>
					<div
						style="
							display: flex;
							align-items: center;
							gap: 10px;
							margin-top: 16px;
							padding: 8px 8px 8px 14px;
							border-radius: 16px;
							background: #eef3fc;
							text-align: left;
						"
					>
						<span style="flex: 1; font-size: 14px; font-weight: 600; color: #3b475c"
							>Create an account to keep your score</span
						><button
							style="
								border: 0;
								background: #2f6fed;
								color: #fff;
								font-weight: 800;
								font-size: 15px;
								padding: 0 16px;
								height: 44px;
								border-radius: 12px;
							"
						>
							Save
						</button>
					</div>
				</div>
			</div>
		</x-dc>
		<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
			class Component extends DCLogic {
			renderVals() { return {}; }
			}
		</script>
	</body>
</html>
