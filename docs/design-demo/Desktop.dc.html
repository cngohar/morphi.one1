<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Desktop: in-game memory</title>
		<script src="./support.js"></script>
	</head>
	<body>
		<x-dc>
			<helmet>
				<link
					href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap"
					rel="stylesheet"
				/>
				<style>
					body {
						margin: 0;
					}
					button {
						font-family: inherit;
						cursor: pointer;
					}
					.c {
						width: 104px;
						height: 128px;
						border: 0;
						padding: 0;
						border-radius: 20px;
						display: flex;
						align-items: center;
						justify-content: center;
					}
					.d {
						background: #c9d8ee;
						box-shadow: inset 0 -5px 0 rgba(27, 36, 51, 0.1);
					}
					.u {
						background: #fff;
						box-shadow: 0 4px 12px rgba(27, 36, 51, 0.1);
					}
					.m {
						background: #e3f5f2;
						opacity: 0.75;
					}
					.k {
						display: inline-block;
						padding: 2px 8px;
						border: 1.5px solid #c9d5e8;
						border-radius: 6px;
						background: #fff;
						font-weight: 800;
						font-size: 13px;
						color: #5a667b;
						margin: 0 6px 0 14px;
					}
				</style>
			</helmet>
			<div
				style="
					height: 800px;
					box-sizing: border-box;
					position: relative;
					overflow: hidden;
					background: #f5f8fc;
					font-family: 'Nunito', system-ui, sans-serif;
					color: #1b2433;
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
				"
			>
				<svg
					width="100%"
					height="100%"
					viewBox="0 0 1280 800"
					preserveAspectRatio="xMidYMid slice"
					aria-hidden="true"
					style="position: absolute; left: 0; top: 0"
				>
					<circle cx="190" cy="620" r="210" fill="#E8F0FC" />
					<circle cx="1110" cy="190" r="170" fill="#FFF3DC" />
					<rect
						x="1010"
						y="560"
						width="170"
						height="170"
						rx="40"

					<path d="M150 150l70-120 70 120z" fill="#EEE8FD" />
				</svg>
				<button
					aria-label="Menu"

						top: 28px;
						width: 48px;
						height: 48px;
						border: 0;
						border-radius: 14px;
						background: #fff;
						box-shadow: 0 2px 8px rgba(27, 36, 51, 0.08);
						display: flex;
						align-items: center;
						justify-content: center;
						left: 28px;
					"
				>
					<svg
						width="24"
						height="24"
						viewBox="0 0 24 24"
						fill="none"
						stroke="#1B2433"

						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path d="M4 7h16M4 12h16M4 17h16" />
					</svg>
				</button>
				<button

						height: 48px;

						box-shadow: 0 2px 8px rgba(27, 36, 51, 0.08);

						align-items: center;
						justify-content: center;
						right: 92px;
					"
				>
					<svg
						width="24"
						height="24"
						viewBox="0 0 24 24"
						fill="none"
						stroke="#1B2433"
						stroke-width="2.3"
						stroke-linecap="round"
						stroke-linejoin="round"

					>
						<path d="M4 9v6h4l5 4V5L8 9z" />
						<path d="M16.5 8.5a5 5 0 010 7" />
					</svg>
				</button>
				<button
					aria-label="Enter fullscreen"
					style="
						position: absolute;
						top: 28px;
						width: 48px;
						height: 48px;
						border: 0;
						border-radius: 14px;
						background: #fff;
						box-shadow: 0 2px 8px rgba(27, 36, 51, 0.08);
						display: flex;
						align-items: center;
						justify-content: center;
						right: 28px;
					"
				>
					<svg
						width="24"
						height="24"
						viewBox="0 0 24 24"
						fill="none"
						stroke="#1B2433"
						stroke-width="2.3"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
					</svg>
				</button>
				<div
					style="
						position: relative;
						font-weight: 800;
						font-size: 18px;
						color: #5a667b;
						margin-bottom: 16px;
					"
				>
					00:42 &nbsp;&middot;&nbsp; Moves 8
				</div>
				<div
					style="
						position: relative;
						padding: 28px;
						border-radius: 32px;
						background: #fff;
						box-shadow: 0 12px 36px rgba(27, 36, 51, 0.1);
					"
				>
					<div style="display: grid; grid-template-columns: repeat(4, 104px); gap: 14px">
						<button class="c d" aria-label="Face-down card"></button>
						<button class="c u" aria-label="Circle">
							<svg width="60" height="60" viewBox="0 0 24 24" aria-hidden="true">
								<circle cx="12" cy="12" r="8" fill="#2F6FED" />
							</svg>
						</button>
						<button class="c d" aria-label="Face-down card"></button>
						<button class="c u" aria-label="Triangle">
							<svg width="60" height="60" viewBox="0 0 24 24" aria-hidden="true">
								<path d="M12 4l9 16H3z" fill="#F5A524" />
							</svg>
						</button>
						<button class="c m" aria-label="Square, matched">
							<svg width="60" height="60" viewBox="0 0 24 24" aria-hidden="true">
								<rect x="5" y="5" width="14" height="14" rx="3" fill="#12A594" />
							</svg>
						</button>
						<button class="c d" aria-label="Face-down card"></button>
						<button class="c u" aria-label="Diamond">
							<svg width="60" height="60" viewBox="0 0 24 24" aria-hidden="true">
								<path d="M12 3l9 9-9 9-9-9z" fill="#8B5CF6" />
							</svg>
						</button>
						<button class="c d" aria-label="Face-down card"></button>
						<button class="c d" aria-label="Face-down card"></button>
						<button class="c m" aria-label="Square, matched">
							<svg width="60" height="60" viewBox="0 0 24 24" aria-hidden="true">
								<rect x="5" y="5" width="14" height="14" rx="3" fill="#12A594" />
							</svg>
						</button>
						<button class="c d" aria-label="Face-down card"></button>
						<button class="c d" aria-label="Face-down card"></button>
						<button class="c u" aria-label="Circle">
							<svg width="60" height="60" viewBox="0 0 24 24" aria-hidden="true">
								<circle cx="12" cy="12" r="8" fill="#2F6FED" />
							</svg>
						</button>
						<button class="c d" aria-label="Face-down card"></button>
						<button class="c d" aria-label="Face-down card"></button>
						<button class="c d" aria-label="Face-down card"></button>
					</div>
				</div>
				<div
					style="
						position: relative;
						margin-top: 22px;
						font-size: 15px;
						font-weight: 700;
						color: #3b475c;
					"
				>
					Find the matching pairs
				</div>
				<div
					style="
						position: absolute;
						bottom: 26px;
						left: 0;
						right: 0;
						text-align: center;
						font-size: 13px;
						font-weight: 700;
						color: #5a667b;
					"
				>
					<span class="k">Esc</span>Menu<span class="k">M</span>Sound<span class="k">F</span
					>Fullscreen
				</div>
			</div>
		</x-dc>
		<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
			class Component extends DCLogic {
			renderVals() { return {}; }
			}
		</script>
	</body>
</html>
