<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Morphi .5 — pilot integration states (fixture)</title>
<style>
:root{font:600 15px/1.35 'Nunito Variable','Nunito',system-ui,sans-serif;color:#1b2433;background:#eef2f7;--board:#dfe9f5;--edge:#90aac9;--back:#a9bfdf;--focus:#2f6fed}
*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer;min-height:44px;border:1px solid #c9d6e4;border-radius:10px;background:#fff;padding:8px 12px}button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.review{padding:8px 14px;background:#fff;border-bottom:1px solid #c9d6e4;font-size:12px}.review strong{color:#b42318}.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px}.tabs button{white-space:nowrap}.tabs [aria-current=page]{background:#1b2433;color:#fff;border-color:#1b2433}
.shell{position:relative;height:calc(100dvh - var(--review-height) - var(--tabs-height));min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:4px;padding:6px 14px 10px;background:var(--board)}.chrome{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}.chrome strong{font-size:14px}.chrome button{min-width:44px}.stage{min-height:0;display:grid;place-items:center;position:relative}.game{height:100%;width:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:4px}.hud{display:flex;justify-content:center;align-items:center;gap:clamp(6px,2vw,22px);flex-wrap:wrap;font-size:12px;font-weight:800}.board-wrap{display:grid;place-items:center;min-height:0}.board{display:grid;grid-template-columns:repeat(var(--cols),var(--size));gap:6px}.card{width:var(--size);height:var(--size);background:var(--back);border:2px solid var(--edge);border-radius:9px;display:grid;place-items:center}.card::after{content:'';width:32%;height:32%;border:2px solid #698ab8;border-radius:5px}.help{margin:0;text-align:center;font-size:12px;color:#344257}
.panel{position:absolute;inset:0;display:grid;place-items:center;background:rgb(223 233 245 / 90%);padding:12px}.panel-inner{max-width:310px;width:100%;padding:16px;background:#fff;border:1px solid #c9d6e4;border-radius:12px;text-align:center}.panel-inner h2{font-size:19px;margin:0 0 6px}.panel-inner p{margin:0 0 12px;font-size:13px}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.actions button:first-child{background:#1b2433;color:#fff;border-color:#1b2433}.footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#344257}.footer button{min-height:38px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media (max-height:500px){.review{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shell{padding-top:2px;padding-bottom:4px}.hud{font-size:11px}.footer{position:absolute;right:14px;bottom:4px}.footer span{display:none}.footer button{min-height:32px}.help{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="review" id="review"><strong>FIXTURE ONLY</strong> · approved .3 board rules; .5 new Card/shell states for owner visual review at 390×844, 844×390, 1280×800. No engine, score, ranked session or saved data.</div>
<nav class="tabs" id="tabs" aria-label="Review states"><button type="button" data-scene="budget">Budget exhausted</button><button type="button" data-scene="resume">Resume failed budget</button><button type="button" data-scene="quads">Quads · 24 cards</button></nav>
<div class="shell" id="shell"><div class="chrome"><button type="button" id="home" aria-label="Home">Home</button><strong id="title"></strong><button type="button" id="sound" aria-label="Sound control (fixture)">Sound</button></div><main class="stage" id="stage"><div class="game"><div class="hud" id="hud"></div><div class="board-wrap"><div class="board" id="board" aria-label="Fixture cards"></div></div><p class="help" id="hint"></p></div><div id="overlay"></div></main><div class="footer"><span id="footer-note">Memory · demonstration only</span><button type="button" id="how">How to play</button></div></div>
<script>
const $=id=>document.getElementById(id);let scene='budget',state='initial';
const labels={budget:'Memory · Tight Budget',resume:'Memory · Tight Budget',quads:'Memory · Quads'};
function panel(title,body,buttons){$('overlay').innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="${title}"><div class="panel-inner"><h2>${title}</h2><p>${body}</p><div class="actions">${buttons.map(([id,label])=>`<button type="button" data-action="${id}">${label}</button>`).join('')}</div></div></div>`;$('overlay').querySelector('button')?.focus()}
function render(){document.documentElement.style.setProperty('--review-height',$('review').offsetHeight+'px');document.documentElement.style.setProperty('--tabs-height',$('tabs').offsetHeight+'px');$('title').textContent=labels[scene];$('hud').textContent=scene==='quads'?'Score  —     Time  0:00     Quads  0 / 6     Misses  0':'Score  —     Time  0:42     Pairs  4 / 6     Misses  8     Attempts left  0 / 12';$('hint').textContent=scene==='quads'?'Flip four cards. All four must show the same symbol.':'No attempts left. The failed round has no score or saved completion.';$('footer-note').textContent=scene==='quads'?'Six groups · four identical cards per group':'Failed board stays visible until you choose another puzzle';
const count=scene==='quads'?24:12,cols=scene==='quads'&&innerHeight<=500?6:scene==='quads'?5:4,rows=Math.ceil(count/cols),stage=$('stage'),room=Math.max(0,stage.clientHeight-35),size=Math.max(40,Math.min(96,Math.floor((stage.clientWidth-24-(cols-1)*6)/cols),Math.floor((room-(rows-1)*6)/rows)));$('board').style.setProperty('--cols',cols);$('board').style.setProperty('--size',size+'px');$('board').replaceChildren(...Array.from({length:count},(_,i)=>{const card=document.createElement('div');card.className='card';card.setAttribute('aria-label',`Card ${i+1}, face down`);return card}));$('overlay').replaceChildren();
if(state==='help')panel('How to play',scene==='quads'?'Quads: flip four cards per attempt. Four identical symbols match. Six attempts per group; the last attempt may win.':'Tight Budget: match all pairs within two attempts per pair. Running out means no saved score.',[['reset','Close help']]);else if(scene==='resume'&&state==='initial')panel('Continue your puzzle?','The attempt budget was exhausted. Resume shows the same failed board; no score was saved.',[['resume','Resume failed board'],['new','Abandon + New']]);else if((scene==='budget'||scene==='resume')&&state!=='next')panel('Run over','No score or saved result. Use Home or try another puzzle.',[['new','Try another'],['home','Home']]);else if(state==='next')panel('Next from selector','This fixture does not choose a real family, variant or ranked seed.',[['reset','Back to review']]);}
$('tabs').onclick=e=>{const key=e.target.dataset.scene;if(!key)return;scene=key;state='initial';for(const button of $('tabs').children)button.dataset.scene===key?button.setAttribute('aria-current','page'):button.removeAttribute('aria-current');render()};$('overlay').onclick=e=>{const action=e.target.dataset.action;if(!action)return;if(action==='resume')state='failed';else if(action==='new'||action==='home')state='next';else state='initial';render()};$('home').onclick=()=>{state='next';render()};$('how').onclick=()=>{state='help';render()};$('sound').onclick=()=>{};window.addEventListener('resize',render);$('tabs').children[0].click();
</script>
</body>
</html>
