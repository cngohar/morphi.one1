<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Morphi.One · Account preview</title>
		<link rel="stylesheet" href="./accounts.css" />
		<style>
			body {
				min-width: 320px;
				background: var(--surface-2);
			}
			.review-header {
				padding: 24px 32px 20px;
				background: var(--surface);
				border-bottom: 1px solid var(--border);
			}
			.review-heading {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 20px;
			}
			.review-heading h1 {
				font-size: 28px;
				margin-top: 6px;
				letter-spacing: -0.03em;
			}
			.review-heading p {
				color: var(--muted);
				font-size: 13px;
			}
			.review-controls {
				display: flex;
				flex-wrap: wrap;
				align-items: end;
				gap: 16px;
				margin-top: 20px;
			}
			.review-controls label {
				font-size: 12px;
				color: var(--muted);
			}
			.review-controls select {
				display: block;
				margin-top: 5px;
				min-height: 40px;
				color: var(--ink);
				font-size: 14px;
			}
			.review-controls .check {
				display: flex;
				align-items: center;
				gap: 8px;
				min-height: 40px;
				font-size: 14px;
				color: var(--ink);
			}
			.review-controls input {
				width: 18px;
				height: 18px;
				margin: 0;
				accent-color: var(--primary);
			}
			.review-link {
				font-size: 13px;
				color: var(--ink-2);
				text-underline-offset: 4px;
			}
			.review-stage {
				display: flex;
				align-items: start;
				justify-content: center;
				padding: 28px 16px 16px;
			}
			.frame-wrap {
				position: relative;
				flex-shrink: 0;
			}
			iframe {
				display: block;
				border: 1px solid var(--border-strong);
				background: var(--bg);
				transform-origin: top left;
			}
			.review-footer {
				text-align: center;
				padding: 4px 20px 24px;
				font-size: 13px;
				line-height: 1.6;
				color: var(--muted);
			}
			.review-footer p + p {
				margin-top: 4px;
			}
			@media (max-width: 600px) {
				.review-header {
					padding: 16px;
				}
				.review-heading {
					align-items: start;
				}
				.review-heading h1 {
					font-size: 24px;
				}
				.review-controls {
					gap: 10px;
				}
				.review-controls label {
					flex: 1;
				}
				.review-controls select {
					width: 100%;
				}
				.review-controls .check {
					flex: none;
				}
				.review-link {
					max-width: 80px;
					text-align: right;
				}
			}
		</style>
		<script type="module" src="./accounts-review.js"></script>
	</head>
	<body>
		<div id="review"></div>
	</body>
</html>
