<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f5f8fc" />
		<title>Morphi · Block placement sample</title>
		<link rel="icon" href="data:," />
		<style>
			@font-face {
				font-family: 'Nunito';
				font-style: normal;
				font-display: swap;
				font-weight: 200 1000;
				src: url('./nunito-latin-wght-normal.woff2') format('woff2-variations');
			}
		</style>
		<style>
			:root {
				color-scheme: light;
				--bg: #f5f8fc;
				--surface: #ffffff;
				--surface-2: #eef3fc;
				--border: #e2e8f0;
				--border-strong: #7a889e;
				--ink: #1b2433;
				--ink-2: #3b475c;
				--muted: #5a667b;
				--primary: #e5532d;
				--primary-strong: #c9441f;
				--accent: #2f6fed;
				--success: #0e7c6e;
				--warning-fill: #f5a524;
				--danger: #b42318;
				--focus: #2f6fed;
				--block-cell: #cdd9ee;
				--block-cell-edge: #c8d3e5;
				--piece-1: var(--primary);
				--piece-2: var(--accent);
				--piece-3: var(--success);
				--piece-4: var(--warning-fill);
				--font:
					'Nunito', ui-rounded, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial,
					sans-serif;
				--dur-instant: 80ms;
				--dur-fast: 150ms;
				--dur-base: 250ms;
				--dur-slow: 400ms;
				--ease-out: cubic-bezier(0.22, 1, 0.36, 1);
				--gap: 1px;
				--safe-top: env(safe-area-inset-top, 0px);
				--safe-right: env(safe-area-inset-right, 0px);
				--safe-bottom: env(safe-area-inset-bottom, 0px);
				--safe-left: env(safe-area-inset-left, 0px);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
			}

			body {
				background: var(--bg);
				color: var(--ink);
				font-family: var(--font);
				font-weight: 700;
				-webkit-font-smoothing: antialiased;
				text-rendering: optimizeLegibility;
				overflow: hidden;
			}

			button,
			a {
				font: inherit;
			}

			button {
				color: inherit;
			}

			a {
				color: inherit;
				text-decoration: none;
			}

			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border: 0;
			}

			[hidden] {
				display: none !important;
			}

			.game {
				height: 100vh;
				height: 100dvh;
				display: grid;
				grid-template-rows: auto minmax(0, 1fr) auto;
				background: var(--bg);
				overflow: hidden;
			}

			.hud {
				display: grid;
				grid-template-columns: 44px minmax(0, 1fr) 44px 44px;
				align-items: center;
				column-gap: 8px;
				row-gap: 2px;
				padding: calc(10px + var(--safe-top)) calc(14px + var(--safe-right)) 0
					calc(14px + var(--safe-left));
			}

			.icon-button {
				width: 44px;
				height: 44px;
				display: grid;
				place-items: center;
				padding: 0;
				border: 1px solid var(--border);
				border-radius: 14px;
				background: var(--surface);
				color: var(--ink);
				cursor: pointer;
				transition:
					background var(--dur-instant) linear,
					transform var(--dur-instant) ease-out;
			}

			.icon-button:hover {
				background: var(--surface-2);
			}

			.icon-button:active {
				transform: scale(0.96);
			}

			.icon-button:focus-visible {
				outline: 3px solid var(--focus);
				outline-offset: 2px;
			}

			.icon-button svg {
				width: 22px;
				height: 22px;
			}

			.sound-off {
				display: none;
			}

			.is-muted .sound-on {
				display: none;
			}

			.is-muted .sound-off {
				display: block;
			}

			.stats {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: clamp(10px, 5vw, 40px);
				min-width: 0;
			}

			.stat {
				display: flex;
				flex-direction: column;
				align-items: center;
				line-height: 1.1;
				min-width: 0;
			}

			.stat-label {
				color: var(--ink-2);
				font-size: 0.6875rem;
				font-weight: 800;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			.stat strong {
				margin-top: 1px;
				font-size: clamp(1rem, 4.2vw, 1.5rem);
				font-weight: 900;
				font-variant-numeric: tabular-nums;
				letter-spacing: -0.02em;
			}

			.stat strong.is-bump {
				animation: stat-bump 160ms var(--ease-out);
			}

			@keyframes stat-bump {
				0%,
				100% {
					transform: scale(1);
				}
				50% {
					transform: scale(1.08);
				}
			}

			.round-meta {
				grid-column: 1 / -1;
				display: flex;
				justify-content: center;
				align-items: baseline;
				gap: 8px;
				margin: 0;
				color: var(--ink-2);
				font-size: 0.6875rem;
				font-weight: 800;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				white-space: nowrap;
			}

			.round-meta .dot {
				color: var(--border-strong);
			}

			.stage {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 0;
				padding: 8px 0;
			}

			.play {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 18px;
				width: 100%;
			}

			.board-wrap {
				position: relative;
				display: flex;
				justify-content: center;
				width: 100%;
			}

			.board {
				display: grid;
				grid-template-columns: repeat(8, minmax(0, 1fr));
				grid-template-rows: repeat(8, minmax(0, 1fr));
				gap: var(--gap);
				width: min(100vw, 480px, calc(100dvh - 240px));
				aspect-ratio: 1;
				touch-action: none;
			}

			.cell {
				position: relative;
				min-width: 0;
				min-height: 0;
				border: 1px solid var(--block-cell-edge);
				border-radius: clamp(7px, 2.2vmin, 11px);
				background: var(--block-cell);
			}

			.cell.filled {
				border-color: transparent;
				background: var(--c);
			}

			.cell.is-clearing {
				z-index: 2;
				animation: clear-cell var(--dur-base) var(--ease-out) forwards;
			}

			@keyframes clear-cell {
				0% {
					transform: scale(1);
					filter: brightness(1);
				}
				35% {
					transform: scale(1.08);
					filter: brightness(1.12);
				}
				100% {
					transform: scale(0.2);
					opacity: 0;
				}
			}

			.gain {
				position: absolute;
				left: 50%;
				top: 48%;
				z-index: 5;
				pointer-events: none;
				color: var(--ink);
				font-size: clamp(1.25rem, 5vw, 1.75rem);
				font-weight: 900;
				font-variant-numeric: tabular-nums;
				letter-spacing: -0.03em;
				opacity: 0;
				transform: translate(-50%, -50%);
			}

			.gain.is-show {
				animation: gain-float 600ms var(--ease-out) forwards;
			}

			@keyframes gain-float {
				0% {
					opacity: 0;
					transform: translate(-50%, -40%) scale(0.92);
				}
				22% {
					opacity: 1;
					transform: translate(-50%, -50%) scale(1);
				}
				100% {
					opacity: 0;
					transform: translate(-50%, -95%) scale(1);
				}
			}

			.tray {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				padding: 10px;
				border: 1px solid var(--border);
				border-radius: 24px;
				background: var(--surface);
				width: 300px;
				max-width: calc(100vw - 20px);
			}

			.tray-slot {
				position: relative;
				width: 88px;
				height: 88px;
				display: grid;
				place-items: center;
				flex: 0 0 auto;
				padding: 0;
				border: 1px solid transparent;
				border-radius: 18px;
				background: var(--surface-2);
				cursor: grab;
				touch-action: none;
				transition:
					background var(--dur-instant) linear,
					transform var(--dur-instant) ease-out,
					outline-color var(--dur-instant) linear;
			}

			.tray-slot:hover {
				background: #e7eefb;
			}

			.tray-slot:active {
				transform: scale(0.97);
			}

			.tray-slot:focus-visible {
				outline: 3px solid var(--focus);
				outline-offset: 2px;
			}

			.tray-slot.is-selected {
				outline: 3px solid var(--accent);
				outline-offset: -1px;
				background: #e8f0ff;
			}

			.tray-slot.is-source {
				opacity: 0.35;
			}

			.tray-slot.is-empty {
				border: 1px dashed #c2cee0;
				background: transparent;
				cursor: default;
			}

			.tray-slot.is-invalid {
				animation: tray-shake 220ms var(--ease-out);
			}

			@keyframes tray-shake {
				0%,
				100% {
					transform: translateX(0);
				}
				25% {
					transform: translateX(-4px);
				}
				50% {
					transform: translateX(4px);
				}
				75% {
					transform: translateX(-2px);
				}
			}

			.mini {
				display: grid;
				grid-template-columns: repeat(var(--w), 20px);
				grid-template-rows: repeat(var(--h), 20px);
				gap: 2px;
				pointer-events: none;
			}

			.mini-cell {
				width: 20px;
				height: 20px;
				border-radius: 6px;
				background: var(--c);
			}

			.ghost {
				position: fixed;
				left: 0;
				top: 0;
				z-index: 50;
				pointer-events: none;
				will-change: transform;
			}

			.ghost-cell {
				position: absolute;
				width: var(--ghost-cell);
				height: var(--ghost-cell);
				border-radius: clamp(6px, 2vmin, 10px);
				background: var(--c);
				opacity: 0.78;
			}

			.ghost.is-invalid .ghost-cell {
				background: var(--danger);
				opacity: 0.65;
			}

			.hint {
				margin: 0;
				padding: 4px 14px calc(10px + var(--safe-bottom));
				text-align: center;
				color: var(--ink-2);
				font-size: 0.8125rem;
				font-weight: 700;
				line-height: 1.35;
			}

			.hint span {
				display: inline-block;
				max-width: 38ch;
			}

			.result-layer {
				position: fixed;
				inset: 0;
				z-index: 100;
				display: grid;
				place-items: center;
				padding: calc(18px + var(--safe-top)) calc(18px + var(--safe-right))
					calc(18px + var(--safe-bottom)) calc(18px + var(--safe-left));
				background: rgb(245 248 252 / 0.82);
				opacity: 0;
				transition: opacity var(--dur-fast) linear;
			}

			.result-layer.is-open {
				opacity: 1;
			}

			.result-card {
				width: min(88vw, 360px);
				padding: 24px;
				border: 1px solid var(--border);
				border-radius: 24px;
				background: var(--surface);
				text-align: center;
				opacity: 0;
				transform: translateY(8px) scale(0.98);
				transition:
					opacity 200ms var(--ease-out),
					transform 200ms var(--ease-out);
			}

			.result-layer.is-open .result-card {
				opacity: 1;
				transform: translateY(0) scale(1);
			}

			.result-eyebrow {
				margin: 0;
				color: var(--ink-2);
				font-size: 0.6875rem;
				font-weight: 800;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			.result-card h2 {
				margin: 4px 0 0;
				font-size: 1.75rem;
				font-weight: 900;
				letter-spacing: -0.03em;
			}

			.result-score {
				margin: 18px 0 0;
				font-size: 2.5rem;
				font-weight: 900;
				font-variant-numeric: tabular-nums;
				letter-spacing: -0.04em;
				line-height: 1;
			}

			.result-best {
				margin: 6px 0 0;
				color: var(--ink-2);
				font-size: 0.8125rem;
				font-weight: 800;
			}

			.result-close {
				margin: 4px 0 0;
				color: var(--primary-strong);
				font-size: 0.8125rem;
				font-weight: 800;
			}

			.result-meta {
				margin: 10px 0 0;
				color: var(--muted);
				font-size: 0.8125rem;
				font-weight: 700;
			}

			.result-actions {
				display: grid;
				gap: 8px;
				margin-top: 22px;
			}

			.primary-button,
			.secondary-button {
				display: grid;
				place-items: center;
				min-height: 50px;
				border-radius: 14px;
				font-weight: 900;
				cursor: pointer;
			}

			.primary-button {
				border: 1px solid var(--primary);
				background: var(--primary);
				color: var(--surface);
			}

			.primary-button:hover {
				background: var(--primary-strong);
			}

			.secondary-button {
				border: 1px solid var(--border);
				background: var(--surface);
			}

			.secondary-button:hover {
				background: var(--surface-2);
			}

			.primary-button:focus-visible,
			.secondary-button:focus-visible {
				outline: 3px solid var(--focus);
				outline-offset: 2px;
			}

			.game.is-over .play {
				opacity: 0.45;
				transition: opacity 300ms linear;
			}

			.game.is-over .hint {
				opacity: 0;
				transition: opacity var(--dur-fast) linear;
			}

			@media (min-width: 1024px) and (min-height: 560px) {
				.play {
					flex-direction: row;
					gap: 24px;
				}

				.board-wrap {
					width: auto;
				}

				.board {
					width: min(calc(100vw - 420px), calc(100dvh - 200px), 520px);
				}
			}

			@media (orientation: landscape) and (max-height: 620px) and (max-width: 1023px) {
				.hud {
					column-gap: 6px;
					padding-top: calc(6px + var(--safe-top));
				}

				.stat strong {
					font-size: 1.125rem;
				}

				.round-meta {
					display: none;
				}

				.stage {
					padding: 6px 0;
				}

				.play {
					flex-direction: row;
					gap: 18px;
				}

				.board-wrap {
					width: auto;
				}

				.board {
					width: min(calc(100vw - 360px), calc(100dvh - 64px), 440px);
					max-height: calc(100dvh - 64px);
				}

				.tray {
					width: 300px;
				}

				.hint {
					display: none;
				}
			}

			@media (max-height: 560px) {
				.result-card {
					padding: 18px;
				}

				.result-card h2 {
					font-size: 1.5rem;
				}

				.result-score {
					margin-top: 12px;
					font-size: 2rem;
				}

				.result-actions {
					grid-template-columns: 1fr 1fr;
					margin-top: 14px;
				}

				.primary-button,
				.secondary-button {
					min-height: 44px;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.icon-button,
				.tray-slot,
				.result-layer,
				.result-card,
				.game.is-over .play,
				.game.is-over .hint {
					transition: none;
				}

				.cell.is-clearing,
				.stat strong.is-bump,
				.tray-slot.is-invalid {
					animation: none;
				}

				.gain.is-show {
					animation: none;
					opacity: 1;
					transform: translate(-50%, -50%);
				}
			}
		</style>
	</head>
	<body>
		<h1 class="sr-only">Block placement sample</h1>

		<div class="game" id="game">
			<header class="hud">
				<a class="icon-button" href="/" aria-label="Home">
					<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<path
							d="M4 11 12 4l8 7v9h-5v-6H9v6H4Z"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linejoin="round"
						/>
					</svg>
				</a>

				<div class="stats">
					<div class="stat">
						<span class="stat-label">Score</span>
						<strong id="score">0</strong>
					</div>
					<div class="stat">
						<span class="stat-label">Lines</span>
						<strong id="lines">0</strong>
					</div>
					<div class="stat">
						<span class="stat-label">Combo</span>
						<strong id="combo">—</strong>
					</div>
				</div>

				<button class="icon-button" id="sound" type="button" aria-label="Mute sound" aria-pressed="true">
					<svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<path d="M4 9h4l5-4v14l-5-4H4Z" fill="currentColor" />
						<path
							d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
						/>
					</svg>
					<svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<path d="M4 9h4l5-4v14l-5-4H4Z" fill="currentColor" />
						<path
							d="m16 9 5 6M21 9l-5 6"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
						/>
					</svg>
				</button>

				<button class="icon-button" id="fullscreen" type="button" aria-label="Fullscreen">
					<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<path
							d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						/>
					</svg>
				</button>

				<p class="round-meta">
					<span id="board-mode">Sample board</span>
					<span class="dot" aria-hidden="true">·</span>
					<span>No timer</span>
				</p>
			</header>

			<main class="stage">
				<div class="play">
					<div class="board-wrap">
						<div class="board" id="board" role="grid" aria-label="8 by 8 board"></div>
						<div class="gain" id="gain" aria-hidden="true"></div>
					</div>
					<div class="tray" id="tray" role="group" aria-label="Pieces"></div>
				</div>
			</main>

			<footer class="hint">
				<span id="hint-text">Drag a piece onto the board. Fill a row or column.</span>
			</footer>
		</div>

		<p class="sr-only" id="announce" aria-live="polite" aria-atomic="true"></p>

		<div class="ghost" id="ghost" aria-hidden="true" hidden></div>

		<div class="result-layer" id="result" hidden>
			<div class="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
				<p class="result-eyebrow">Run ended</p>
				<h2 id="result-title">No moves left</h2>
				<p class="result-score" id="result-score">0</p>
				<p class="result-best" id="result-best">Best 0</p>
				<p class="result-close" id="result-close" hidden></p>
				<p class="result-meta" id="result-meta">0 lines · 0 pieces</p>
				<div class="result-actions">
					<button class="primary-button" id="play-again" type="button">Play again</button>
					<a class="secondary-button" href="/">Home</a>
				</div>
			</div>
		</div>

		<script>
			const BOARD = 8;
			const GAP = 1;
			const CAP = 300;
			const SO_CLOSE = 250;
			const BEST_KEY = 'morphi.block.demo.best';
			const SOUND_KEY = 'morphi.block.demo.sound';
			const params = new URLSearchParams(location.search);
			const startEmpty = params.has('empty');

			const PIECES = [
				{
					id: 'one',
					name: 'single block',
					cells: [
						[0, 0]
					],
					color: 'var(--piece-1)'
				},
				{
					id: 'two',
					name: 'two-block bar',
					cells: [
						[0, 0],
						[0, 1]
					],
					color: 'var(--piece-2)'
				},
				{
					id: 'three',
					name: 'three-block bar',
					cells: [
						[0, 0],
						[0, 1],
						[0, 2]
					],
					color: 'var(--piece-3)'
				},
				{
					id: 'l3',
					name: 'small L',
					cells: [
						[0, 0],
						[0, 1],
						[1, 1]
					],
					color: 'var(--piece-4)'
				},
				{
					id: 'four',
					name: 'four-block bar',
					cells: [
						[0, 0],
						[0, 1],
						[0, 2],
						[0, 3]
					],
					color: 'var(--piece-1)'
				},
				{
					id: 'square',
					name: 'square',
					cells: [
						[0, 0],
						[1, 0],
						[0, 1],
						[1, 1]
					],
					color: 'var(--piece-2)'
				},
				{
					id: 'l4',
					name: 'large L',
					cells: [
						[0, 0],
						[0, 1],
						[0, 2],
						[1, 2]
					],
					color: 'var(--piece-3)'
				},
				{
					id: 't4',
					name: 'T shape',
					cells: [
						[0, 0],
						[1, 0],
						[2, 0],
						[1, 1]
					],
					color: 'var(--piece-4)'
				},
				{
					id: 's4',
					name: 'S shape',
					cells: [
						[1, 0],
						[2, 0],
						[0, 1],
						[1, 1]
					],
					color: 'var(--piece-1)'
				}
			];

			for (const piece of PIECES) {
				piece.w = Math.max(...piece.cells.map(([x]) => x)) + 1;
				piece.h = Math.max(...piece.cells.map(([, y]) => y)) + 1;
			}

			const byId = Object.fromEntries(PIECES.map((piece) => [piece.id, piece]));
			const firstTray = () => [byId.one, byId.l3, byId.square];

			const boardEl = document.getElementById('board');
			const trayEl = document.getElementById('tray');
			const gameEl = document.getElementById('game');
			const scoreEl = document.getElementById('score');
			const linesEl = document.getElementById('lines');
			const comboEl = document.getElementById('combo');
			const hintEl = document.getElementById('hint-text');
			const gainEl = document.getElementById('gain');
			const ghostEl = document.getElementById('ghost');
			const announceEl = document.getElementById('announce');
			const resultEl = document.getElementById('result');
			const resultScoreEl = document.getElementById('result-score');
			const resultBestEl = document.getElementById('result-best');
			const resultCloseEl = document.getElementById('result-close');
			const resultMetaEl = document.getElementById('result-meta');
			const playAgainEl = document.getElementById('play-again');
			const soundEl = document.getElementById('sound');
			const fullscreenEl = document.getElementById('fullscreen');
			const boardModeEl = document.getElementById('board-mode');
			const number = new Intl.NumberFormat('en-US');

			let state = createState();
			let selected = null;
			let drag = null;
			let suppressClick = false;
			let bag = [];
			const keyboardAnchor = { x: 0, y: 0 };
			let best = readNumber(BEST_KEY);
			let soundOn = readFlag(SOUND_KEY);
			let audioContext = null;
			let lastScore = 0;
			let lastLines = 0;
			let lastCombo = 0;

			function readNumber(key) {
				try {
					return Number(localStorage.getItem(key)) || 0;
				} catch {
					return 0;
				}
			}

			function readFlag(key) {
				try {
					return localStorage.getItem(key) !== 'off';
				} catch {
					return true;
				}
			}

			function sampleBoard() {
				const cells = Array(BOARD * BOARD).fill(null);

				for (const [x, y, color] of [
					[0, 5, 'var(--piece-3)'],
					[0, 6, 'var(--piece-3)'],
					[0, 7, 'var(--piece-3)'],
					[1, 6, 'var(--piece-3)'],
					[1, 7, 'var(--piece-3)'],
					[3, 5, 'var(--piece-2)'],
					[3, 6, 'var(--piece-2)'],
					[3, 7, 'var(--piece-2)'],
					[4, 6, 'var(--piece-2)'],
					[4, 7, 'var(--piece-2)'],
					[6, 5, 'var(--piece-4)'],
					[6, 6, 'var(--piece-4)'],
					[6, 7, 'var(--piece-4)'],
					[2, 7, 'var(--piece-1)'],
					[5, 7, 'var(--piece-1)']
				]) {
					cells[y * BOARD + x] = color;
				}

				return cells;
			}

			function createState() {
				return {
					board: startEmpty ? Array(BOARD * BOARD).fill(null) : sampleBoard(),
					tray: firstTray(),
					score: 0,
					lines: 0,
					pieces: 0,
					combo: 0,
					over: false,
					busy: false
				};
			}

			function drawTray() {
				if (bag.length < 3) {
					bag = PIECES.slice();
					for (let index = bag.length - 1; index > 0; index -= 1) {
						const swap = Math.floor(Math.random() * (index + 1));
						[bag[index], bag[swap]] = [bag[swap], bag[index]];
					}
				}

				return [bag.pop(), bag.pop(), bag.pop()];
			}

			function canPlace(piece, x, y) {
				if (x < 0 || y < 0 || x + piece.w > BOARD || y + piece.h > BOARD) {
					return false;
				}

				return piece.cells.every(([dx, dy]) => state.board[(y + dy) * BOARD + x + dx] === null);
			}

			function canPlaceAnywhere(piece) {
				for (let y = 0; y <= BOARD - piece.h; y += 1) {
					for (let x = 0; x <= BOARD - piece.w; x += 1) {
						if (canPlace(piece, x, y)) {
							return true;
						}
					}
				}

				return false;
			}

			function buildBoard() {
				boardEl.textContent = '';

				for (let index = 0; index < BOARD * BOARD; index += 1) {
					const cell = document.createElement('div');
					cell.className = 'cell';
					cell.dataset.index = String(index);
					cell.setAttribute('role', 'gridcell');
					boardEl.append(cell);
				}
			}

			function renderBoard(clearing = new Set()) {
				const cells = boardEl.children;

				for (let index = 0; index < cells.length; index += 1) {
					const cell = cells[index];
					const color = state.board[index];
					cell.classList.toggle('filled', Boolean(color));
					cell.classList.toggle('is-clearing', clearing.has(index));

					if (color) {
						cell.style.setProperty('--c', color);
						cell.setAttribute(
							'aria-label',
							`Row ${Math.floor(index / BOARD) + 1}, column ${(index % BOARD) + 1}, filled`
						);
					} else {
						cell.style.removeProperty('--c');
						cell.setAttribute(
							'aria-label',
							`Row ${Math.floor(index / BOARD) + 1}, column ${(index % BOARD) + 1}, empty`
						);
					}
				}
			}

			function renderTray() {
				trayEl.textContent = '';

				state.tray.forEach((piece, index) => {
					const slot = document.createElement('button');
					slot.type = 'button';
					slot.className = 'tray-slot';
					slot.dataset.index = String(index);
					slot.setAttribute('aria-pressed', String(selected === index));

					if (!piece) {
						slot.classList.add('is-empty');
						slot.setAttribute('aria-label', 'Empty tray slot');
						slot.disabled = true;
						trayEl.append(slot);
						return;
					}

					slot.setAttribute('aria-label', `Piece ${index + 1}: ${piece.name}`);
					slot.classList.toggle('is-selected', selected === index);

					const mini = document.createElement('span');
					mini.className = 'mini';
					mini.style.setProperty('--w', String(piece.w));
					mini.style.setProperty('--h', String(piece.h));
					mini.style.setProperty('--c', piece.color);

					for (const [x, y] of piece.cells) {
						const cell = document.createElement('span');
						cell.className = 'mini-cell';
						cell.style.gridColumn = String(x + 1);
						cell.style.gridRow = String(y + 1);
						mini.append(cell);
					}

					slot.append(mini);
					slot.addEventListener('pointerdown', (event) => startDrag(event, index, slot));
					slot.addEventListener('pointermove', moveDrag);
					slot.addEventListener('pointerup', endDrag);
					slot.addEventListener('pointercancel', cancelDrag);
					slot.addEventListener('click', () => {
						if (suppressClick) {
							return;
						}
						selectPiece(index);
					});

					trayEl.append(slot);
				});
			}

			function selectPiece(index) {
				if (state.busy || state.over || !state.tray[index]) {
					return;
				}

				selected = selected === index ? null : index;
				keyboardAnchor.x = 0;
				keyboardAnchor.y = 0;
				hideGhost();
				renderTray();
				updateHint();
				ensureAudio();
				play('pick');
			}

			function updateHint() {
				hintEl.textContent =
					selected === null
						? 'Drag a piece onto the board. Fill a row or column.'
						: 'Tap a cell to place the piece, or drag it.';
			}

			function announce(message) {
				announceEl.textContent = message;
			}

			function bump(element) {
				element.classList.remove('is-bump');
				void element.offsetWidth;
				element.classList.add('is-bump');
			}

			function updateHud() {
				scoreEl.textContent = number.format(state.score);
				linesEl.textContent = number.format(state.lines);
				comboEl.textContent = state.combo > 0 ? `x${state.combo}` : '—';

				if (state.score !== lastScore) {
					bump(scoreEl);
					lastScore = state.score;
				}

				if (state.lines !== lastLines) {
					bump(linesEl);
					lastLines = state.lines;
				}

				if (state.combo !== lastCombo) {
					bump(comboEl);
					lastCombo = state.combo;
				}
			}

			function showGain(amount) {
				gainEl.textContent = `+${number.format(amount)}`;
				gainEl.classList.remove('is-show');
				void gainEl.offsetWidth;
				gainEl.classList.add('is-show');
			}

			function slotsFor() {
				const rows = [];
				const columns = [];

				for (let y = 0; y < BOARD; y += 1) {
					const full = state.board.slice(y * BOARD, y * BOARD + BOARD).every(Boolean);

					if (full) {
						rows.push(y);
					}
				}

				for (let x = 0; x < BOARD; x += 1) {
					let full = true;

					for (let y = 0; y < BOARD; y += 1) {
						if (state.board[y * BOARD + x] === null) {
							full = false;
							break;
						}
					}

					if (full) {
						columns.push(x);
					}
				}

				const cells = new Set();

				for (const y of rows) {
					for (let x = 0; x < BOARD; x += 1) {
						cells.add(y * BOARD + x);
					}
				}

				for (const x of columns) {
					for (let y = 0; y < BOARD; y += 1) {
						cells.add(y * BOARD + x);
					}
				}

				return { cells, lines: rows.length + columns.length };
			}

			function placeAt(index, x, y) {
				const piece = state.tray[index];

				if (!piece || state.busy || state.over) {
					return false;
				}

				if (!canPlace(piece, x, y)) {
					play('invalid');
					return false;
				}

				hideGhost();
				state.busy = true;
				state.pieces += 1;

				for (const [dx, dy] of piece.cells) {
					state.board[(y + dy) * BOARD + x + dx] = piece.color;
				}

				state.tray[index] = null;
				selected = null;
				renderTray();
				updateHint();

				const { cells, lines } = slotsFor();
				renderBoard(cells);

				if (lines === 0) {
					state.combo = 0;
					state.busy = false;
					updateHud();
					play('place');
					announce(`Piece placed. Score ${number.format(state.score)}.`);
					finishTurn();
					return true;
				}

				const combo = state.combo + 1;
				const gained = lines * 100 + (lines - 1) * 50 + (combo - 1) * 50;

				play('clear', combo);

				setTimeout(() => {
					for (const cell of cells) {
						state.board[cell] = null;
					}

					state.score += gained;
					state.lines += lines;
					state.combo = combo;
					renderBoard();
					updateHud();
					showGain(gained);
					announce(
						`${lines} ${lines === 1 ? 'line' : 'lines'} cleared. ${gained} points. Score ${number.format(state.score)}.`
					);
					finishTurn();
				}, 250);

				return true;
			}

			function finishTurn() {
				if (state.tray.every((piece) => !piece)) {
					state.busy = true;

					setTimeout(() => {
						state.tray = drawTray();
						renderTray();
						state.busy = false;
						checkOver();
					}, 120);
					return;
				}

				state.busy = false;
				checkOver();
			}

			function checkOver() {
				if (state.over) {
					return;
				}

				if (state.pieces >= CAP) {
					endRun();
					return;
				}

				if (state.tray.every((piece) => !piece)) {
					return;
				}

				if (!state.tray.some((piece) => piece && canPlaceAnywhere(piece))) {
					endRun();
				}
			}

			function endRun() {
				if (state.over) {
					return;
				}

				state.over = true;
				state.busy = true;
				selected = null;
				hideGhost();
				renderTray();
				gameEl.classList.add('is-over');
				play('end');

				const previousBest = best;

				if (state.score > best) {
					best = state.score;

					try {
						localStorage.setItem(BEST_KEY, String(best));
					} catch {
						null;
					}
				}

				setTimeout(() => showResult(previousBest), 450);
			}

			function showResult(previousBest) {
				const isNewBest = state.score > previousBest && state.score > 0;
				const gap = previousBest - state.score;
				const isClose = !isNewBest && previousBest > 0 && gap > 0 && gap <= SO_CLOSE;

				resultScoreEl.textContent = number.format(state.score);
				resultBestEl.textContent = isNewBest
					? `New best · ${number.format(best)}`
					: `Best ${number.format(best)}`;
				resultCloseEl.hidden = !isClose;
				resultCloseEl.textContent = isClose
					? `${number.format(gap)} points off your best`
					: '';
				const lineWord = state.lines === 1 ? 'line' : 'lines';
				const pieceWord = state.pieces === 1 ? 'piece' : 'pieces';
				resultMetaEl.textContent = `${number.format(state.lines)} ${lineWord} · ${number.format(state.pieces)} ${pieceWord}`;
				resultEl.hidden = false;
				announce(`Run ended. Score ${number.format(state.score)}.`);
				requestAnimationFrame(() => resultEl.classList.add('is-open'));
				playAgainEl.focus();
			}

			function reset() {
				state = createState();
				selected = null;
				drag = null;
				bag = [];
				lastScore = 0;
				lastLines = 0;
				lastCombo = 0;
				hideGhost();
				resultEl.classList.remove('is-open');
				resultEl.hidden = true;
				gameEl.classList.remove('is-over');
				renderTray();
				renderBoard();
				updateHud();
				updateHint();
				boardModeEl.textContent = startEmpty ? 'New run' : 'Sample board';
				announce('New run. Drag a piece onto the board.');
				trayEl.querySelector('button:not(:disabled)')?.focus();
			}

			function boardMetrics() {
				const rect = boardEl.getBoundingClientRect();
				const cell = (rect.width - (BOARD - 1) * GAP) / BOARD;
				return { rect, cell, pitch: cell + GAP };
			}

			function showGhost(piece, left, top, cell, valid) {
				ghostEl.textContent = '';
				ghostEl.hidden = false;
				ghostEl.style.setProperty('--ghost-cell', `${cell}px`);
				ghostEl.style.setProperty('--c', piece.color);
				ghostEl.style.width = `${piece.w * cell + (piece.w - 1) * GAP}px`;
				ghostEl.style.height = `${piece.h * cell + (piece.h - 1) * GAP}px`;
				ghostEl.classList.toggle('is-invalid', !valid);

				for (const [x, y] of piece.cells) {
					const ghostCell = document.createElement('span');
					ghostCell.className = 'ghost-cell';
					ghostCell.style.left = `${x * (cell + GAP)}px`;
					ghostCell.style.top = `${y * (cell + GAP)}px`;
					ghostEl.append(ghostCell);
				}

				ghostEl.style.transform = `translate3d(${left}px, ${top}px, 0)`;
			}

			function hideGhost() {
				ghostEl.hidden = true;
				ghostEl.textContent = '';
			}

			function startDrag(event, index, slot) {
				if (state.busy || state.over || !state.tray[index]) {
					return;
				}

				const piece = state.tray[index];
				const mini = slot.querySelector('.mini');
				const rect = mini.getBoundingClientRect();
				const miniPitch = 22;
				const grabX = Math.max(
					0,
					Math.min(piece.w - 1, Math.floor((event.clientX - rect.left) / miniPitch))
				);
				const grabY = Math.max(
					0,
					Math.min(piece.h - 1, Math.floor((event.clientY - rect.top) / miniPitch))
				);
				const grabFracX = Math.max(
					0,
					Math.min(1, (event.clientX - rect.left - grabX * miniPitch) / 20)
				);
				const grabFracY = Math.max(
					0,
					Math.min(1, (event.clientY - rect.top - grabY * miniPitch) / 20)
				);

				drag = {
					index,
					slot,
					piece,
					pointerId: event.pointerId,
					startX: event.clientX,
					startY: event.clientY,
					grabX,
					grabY,
					grabFracX,
					grabFracY,
					moved: false,
					anchorX: 0,
					anchorY: 0,
					over: false,
					valid: false
				};

				slot.setPointerCapture(event.pointerId);
				ensureAudio();
			}

			function moveDrag(event) {
				if (!drag || event.pointerId !== drag.pointerId) {
					return;
				}

				const distance = Math.hypot(
					event.clientX - drag.startX,
					event.clientY - drag.startY
				);

				if (!drag.moved && distance > 6) {
					drag.moved = true;
					selected = null;
					drag.slot.classList.add('is-source');
					updateHint();
					play('pick');
				}

				if (!drag.moved) {
					return;
				}

				const { rect, cell, pitch } = boardMetrics();
				const over =
					event.clientX >= rect.left &&
					event.clientX <= rect.right &&
					event.clientY >= rect.top &&
					event.clientY <= rect.bottom;

				let left;
				let top;
				let anchorX;
				let anchorY;
				let valid = false;

				if (over) {
					const boardX = Math.max(
						0,
						Math.min(BOARD - 1, Math.floor((event.clientX - rect.left) / pitch))
					);
					const boardY = Math.max(
						0,
						Math.min(BOARD - 1, Math.floor((event.clientY - rect.top) / pitch))
					);
					anchorX = boardX - drag.grabX;
					anchorY = boardY - drag.grabY;
					left = rect.left + anchorX * pitch;
					top = rect.top + anchorY * pitch;
					valid = canPlace(drag.piece, anchorX, anchorY);
				} else {
					left = event.clientX - (drag.grabX + drag.grabFracX) * pitch;
					top = event.clientY - (drag.grabY + drag.grabFracY) * pitch;
					anchorX = 0;
					anchorY = 0;
				}

				drag.anchorX = anchorX;
				drag.anchorY = anchorY;
				drag.over = over;
				drag.valid = valid;
				showGhost(drag.piece, left, top, cell, valid || !over);
			}

			function endDrag(event) {
				if (!drag || event.pointerId !== drag.pointerId) {
					return;
				}

				const current = drag;
				drag = null;

				if (!current.moved) {
					return;
				}

				event.preventDefault();
				suppressClick = true;
				setTimeout(() => {
					suppressClick = false;
				}, 60);
				hideGhost();
				current.slot.classList.remove('is-source');

				if (current.over && current.valid) {
					placeAt(current.index, current.anchorX, current.anchorY);
				} else {
					play('invalid');
					current.slot.classList.remove('is-invalid');
					void current.slot.offsetWidth;
					current.slot.classList.add('is-invalid');
				}
			}

			function cancelDrag() {
				if (!drag) {
					return;
				}

				drag.slot.classList.remove('is-source');
				drag = null;
				hideGhost();
			}

			function boardCellFromEvent(event) {
				const cell = event.target.closest('.cell');

				if (!cell) {
					return null;
				}

				const index = Number(cell.dataset.index);
				return { x: index % BOARD, y: Math.floor(index / BOARD) };
			}

			function ensureAudio() {
				if (!soundOn) {
					return null;
				}

				if (!audioContext) {
					const Audio = window.AudioContext || window.webkitAudioContext;

					if (!Audio) {
						return null;
					}

					audioContext = new Audio();
				}

				if (audioContext.state === 'suspended') {
					audioContext.resume();
				}

				return audioContext;
			}

			function tone(context, frequency, duration, type = 'sine', volume = 0.045, delay = 0) {
				const start = context.currentTime + delay;
				const oscillator = context.createOscillator();
				const gain = context.createGain();
				oscillator.type = type;
				oscillator.frequency.setValueAtTime(frequency, start);
				gain.gain.setValueAtTime(0.0001, start);
				gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
				gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
				oscillator.connect(gain);
				gain.connect(context.destination);
				oscillator.start(start);
				oscillator.stop(start + duration + 0.02);
			}

			function play(kind, combo = 0) {
				if (!soundOn) {
					return;
				}

				const context = ensureAudio();

				if (!context) {
					return;
				}

				if (kind === 'pick') {
					tone(context, 360, 0.05, 'sine', 0.035);
				} else if (kind === 'place') {
					tone(context, 240, 0.06, 'sine', 0.045);
				} else if (kind === 'invalid') {
					tone(context, 120, 0.09, 'square', 0.035);
				} else if (kind === 'clear') {
					tone(context, 520 + (combo - 1) * 40, 0.1, 'sine', 0.05);
					tone(context, 780 + (combo - 1) * 40, 0.14, 'sine', 0.04, 0.06);
				} else if (kind === 'end') {
					tone(context, 280, 0.18, 'sine', 0.05);
					tone(context, 180, 0.24, 'sine', 0.04, 0.12);
				}
			}

			function renderSound() {
				soundEl.classList.toggle('is-muted', !soundOn);
				soundEl.setAttribute('aria-pressed', String(soundOn));
				soundEl.setAttribute('aria-label', soundOn ? 'Mute sound' : 'Enable sound');

				try {
					localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off');
				} catch {
					null;
				}
			}

			boardEl.addEventListener('click', (event) => {
				if (suppressClick || state.busy || state.over || selected === null) {
					return;
				}

				const position = boardCellFromEvent(event);

				if (!position) {
					return;
				}

				const index = selected;

				if (!placeAt(index, position.x, position.y)) {
					const slot = trayEl.querySelector(`[data-index="${index}"]`);
					slot?.classList.remove('is-invalid');
					void slot?.offsetWidth;
					slot?.classList.add('is-invalid');
				}
			});

			document.addEventListener('keydown', (event) => {
				if (state.over || state.busy) {
					return;
				}

				if (event.key === 'Escape' && selected !== null) {
					selected = null;
					hideGhost();
					renderTray();
					updateHint();
					return;
				}

				if (selected === null) {
					return;
				}

				if (event.key === 'Enter') {
					event.preventDefault();
					const piece = state.tray[selected];

					if (!piece) {
						return;
					}

					if (!placeAt(selected, keyboardAnchor.x, keyboardAnchor.y)) {
						play('invalid');
					}
					return;
				}

				const moves = {
					ArrowLeft: [-1, 0],
					ArrowRight: [1, 0],
					ArrowUp: [0, -1],
					ArrowDown: [0, 1]
				};
				const move = moves[event.key];

				if (!move) {
					return;
				}

				event.preventDefault();
				const piece = state.tray[selected];

				if (!piece) {
					return;
				}

				keyboardAnchor.x = Math.max(
					0,
					Math.min(BOARD - piece.w, keyboardAnchor.x + move[0])
				);
				keyboardAnchor.y = Math.max(
					0,
					Math.min(BOARD - piece.h, keyboardAnchor.y + move[1])
				);
				const { rect, cell, pitch } = boardMetrics();
				showGhost(
					piece,
					rect.left + keyboardAnchor.x * pitch,
					rect.top + keyboardAnchor.y * pitch,
					cell,
					canPlace(piece, keyboardAnchor.x, keyboardAnchor.y)
				);
			});

			soundEl.addEventListener('click', () => {
				soundOn = !soundOn;
				renderSound();

				if (soundOn) {
					ensureAudio();
					play('pick');
				}
			});

			fullscreenEl.addEventListener('click', () => {
				if (document.fullscreenElement) {
					document.exitFullscreen?.().catch(() => null);
				} else {
					document.documentElement.requestFullscreen?.().catch(() => null);
				}
			});

			playAgainEl.addEventListener('click', reset);

			document.addEventListener('visibilitychange', () => {
				if (document.hidden) {
					hideGhost();
				}
			});

			document.addEventListener('pointerdown', () => {
				ensureAudio();
			});

			buildBoard();
			renderTray();
			renderBoard();
			updateHud();
			renderSound();
			boardModeEl.textContent = startEmpty ? 'New run' : 'Sample board';
		</script>
	</body>
</html>
