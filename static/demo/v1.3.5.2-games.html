<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morphi v1.3.5.2 — Games loading review</title>
<style>
:root{color-scheme:light;--bg:#eef2f7;--surface:#fff;--surface-2:#e5edf7;--border:#c9d6e4;--ink:#1b2433;--ink-2:#344257;--muted:#5a6b82;--primary:#e5532d;--focus:#2f6fed;--danger:#b42318;--chip-teal:#d7efea;font:600 16px/1.35 'Nunito Variable','Nunito',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button,a{min-height:38px}a{color:var(--ink-2)}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.review{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 24px;background:#fff;border-bottom:1px solid var(--border);font-size:13px}.review strong{color:var(--danger)}.review label{display:flex;align-items:center;gap:6px}.review select{padding:6px}.review small{color:var(--muted)}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100svh}.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:28px 22px;display:flex;flex-direction:column;gap:22px}.brand{font-size:26px;font-weight:950;letter-spacing:-.04em}.sidebar nav{display:grid;gap:6px}.sidebar nav span{padding:12px;font-size:13px;font-weight:800;color:var(--ink-2)}.sidebar nav .active{background:var(--surface-2);color:#c9441f;border-radius:8px}.body{min-width:0}.body header{min-height:72px;border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}h1{font-size:20px;color:var(--ink);margin:0}.body main{padding:28px 32px 48px;min-width:0}h2{font-size:19px;margin:0 0 16px}h3{font-size:15px;margin:18px 0 10px}.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:5px;margin-bottom:22px;background:var(--surface-2);border-radius:10px;width:fit-content;max-width:100%}.tabs button{padding:9px 14px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:800}.tabs button[aria-current=page]{color:#c9441f;background:var(--surface)}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}.metric,.card{padding:22px;background:var(--surface);border:1px solid var(--border);border-radius:12px;min-width:0}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:34px;font-weight:950;margin-top:8px}.card{margin-bottom:20px}.card p,.note{font-size:13px;color:var(--muted);line-height:1.55}.family-card{display:block;text-decoration:none;color:inherit}.row{border:1px solid var(--border);border-radius:8px;padding:16px;margin:14px 0;display:grid;grid-template-columns:minmax(140px,1.2fr) minmax(240px,2fr) auto;gap:12px;align-items:center}.row strong,.row code,.row small{display:block}.row code{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.row small{font-size:11px;color:var(--muted)}.row .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;background:var(--surface-2);padding:8px;border-radius:6px}.stats strong{font-size:14px}.status{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--chip-teal);margin-top:5px}.status.off{background:var(--danger);color:white}.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 12px;text-decoration:none;font-size:13px;font-weight:800}.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.pagination{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0}.pagination span{font-size:13px;color:var(--muted);margin-right:auto}.table-wrap{max-width:100%;overflow:auto}.table-wrap table{border-collapse:collapse;min-width:850px;width:100%;font-size:12px}.table-wrap th,.table-wrap td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--border)}.table-wrap th{background:var(--surface-2);font-size:10px;color:var(--muted);text-transform:uppercase}.alert{border-left:4px solid var(--danger);background:#fff3f2;padding:12px 16px;font-size:13px}.empty{padding:22px;background:var(--surface-2);font-size:13px}.drawer{position:fixed;margin:0 0 0 auto;inset:0 0 0 auto;width:min(500px,100%);height:100%;max-height:none;border:0;padding:28px;background:var(--surface);color:var(--ink);overflow:auto}.drawer::backdrop{background:rgb(0 0 0 / 45%)}.drawer h2{font-size:20px;overflow-wrap:anywhere}.drawer h3{font-size:13px;text-transform:uppercase;color:var(--muted)}.drawer .close{float:right}.drawer .table-wrap table{min-width:720px}.drawer .pagination{margin-bottom:0}.drawer .note{margin:12px 0}.drawer .detail{padding-top:20px}.drawer code{font-size:12px;color:var(--muted)}
@media(max-width:900px){.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:1fr}.row .stats{text-align:left}.actions{justify-content:flex-start}.sidebar{padding:18px 12px}.shell{grid-template-columns:160px minmax(0,1fr)}}
@media(max-width:650px){.shell{grid-template-columns:1fr}.sidebar{display:none}.body header{padding:14px 16px}.body main{padding:18px 14px}.metric,.card{padding:16px}.metric strong{font-size:28px}.row .stats{grid-template-columns:repeat(2,1fr)}.drawer{padding:16px}.review{padding:8px 14px}}
</style>
</head>
<body>
<div class="review" aria-label="Fixture preview controls"><strong>FIXTURE ONLY · no live data or actions</strong><label>Scenario <select id="scenario"><option value="normal">100 rows · paging</option><option value="empty">Empty list</option><option value="failure">List failed</option><option value="detail-loading">Detail loading</option><option value="detail-failure">Detail failed</option></select></label><small>Set browser viewport to 390×844, 844×390 or 1280×800. Page size 10 is illustrative, not approved.</small></div>
<div class="shell"><aside class="sidebar"><span class="brand">morphi.</span><nav aria-label="Operator sections"><span>Dashboard</span><span>Users</span><span class="active">Games</span><span>Scoring</span><span>Audit</span></nav><span class="note">Operator workspace · visual fixture</span></aside><div class="body"><header><h1>Games</h1><span>Local operator · design reference</span></header><main id="main"></main></div></div>
<dialog class="drawer" id="drawer" aria-labelledby="drawer-title"><button type="button" class="btn close" id="close" aria-label="Close variant details">Close</button><div id="drawer-body"></div></dialog>
<script>
const real=['Classic','No preview','Trios','Moving cards'];
const fixture=Array.from({length:100},(_,i)=>({id:i<4?`memory:${['classic','no-preview','trios','moving'][i]}`:`fixture-row-${String(i+1).padStart(3,'0')}`,name:real[i]||`Fixture row ${i+1}`,state:i===99||i===1?'Disabled':'Enabled',shown:i===99?0:(i+1)*3,played:i===99?0:i+1,finished:i===99?0:Math.floor((i+1)/2)}));
const size=10,history=Array.from({length:23},(_,i)=>({group:'memory-1',version:`fixture-version-${String(i+1).padStart(2,'0')}`,completed:i+1}));
if(fixture.length!==100||fixture[0].id!=='memory:classic'||fixture[99].shown!==0||Math.ceil(history.length/size)!==3)throw Error('Broken preview fixture');
let family='overview',tab='statistics',page=0,historyPage=0,detailPage=0,selected=null,trigger=null,loading=null;
const main=document.getElementById('main'),drawer=document.getElementById('drawer'),drawerBody=document.getElementById('drawer-body'),scenario=document.getElementById('scenario');
function pager(index,total,target){const count=Math.max(1,Math.ceil(total/size));return `<nav class="pagination" aria-label="${target==='list'?'Variant':'History'} pages"><span>Page ${index+1} of ${count} · ${total} ${target==='list'?'rows':'versions'}</span><button type="button" class="btn" data-page="${target}" data-index="0" ${index===0?'disabled':''}>First</button><button type="button" class="btn" data-page="${target}" data-index="${Math.max(0,index-1)}" ${index===0?'disabled':''}>Previous</button><button type="button" class="btn" data-page="${target}" data-index="${Math.min(count-1,index+1)}" ${index===count-1?'disabled':''}>Next</button><button type="button" class="btn" data-page="${target}" data-index="${count-1}" ${index===count-1?'disabled':''}>Last</button></nav>`}
function tabs(items,current,kind){return `<nav class="tabs" aria-label="${kind==='family'?'Games':'Game sections'}">${items.map(([value,label])=>`<button type="button" data-${kind}="${value}" ${value===current?'aria-current="page"':''}>${label}</button>`).join('')}</nav>`}
function row(item){return `<div class="row"><div><strong>${item.name}</strong><code>${item.id}</code><span class="status ${item.state==='Disabled'?'off':''}">${item.state}</span></div><div class="stats"><div><small>Shown</small><strong>${item.shown}</strong></div><div><small>Played</small><strong>${item.played}</strong></div><div><small>Play rate</small><strong>${item.shown?Math.round(item.played/item.shown*100)+'%':'—'}</strong></div><div><small>Total completed</small><strong>${item.finished}</strong></div></div><div class="actions"><button type="button" class="btn" data-inspect="${item.id}" aria-haspopup="dialog">Inspect</button><button type="button" class="btn" disabled title="No mutations in fixture">${item.state==='Disabled'?'Enable':'Disable'}</button></div></div>`}
function table(rows){return `<div class="table-wrap"><table><thead><tr><th>Rules group</th><th>Version</th><th>Completed</th><th>Ranked</th><th>Best</th><th>Average</th><th>Duration</th><th>Hidden</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.group}</td><td>${r.version}</td><td>${r.completed}</td><td>0</td><td>840</td><td>420.0</td><td>32.0</td><td>0</td></tr>`).join('')||'<tr><td colspan="8">No history yet.</td></tr>'}</tbody></table></div>`}
function render(){const state=scenario.value;main.innerHTML=tabs([['overview','Overview'],['memory','Memory'],['block','Block'],['connect','Connect']],family,'family')+(family==='overview'?`<div class="metric-grid"><div class="metric"><span>Families</span><strong>3</strong></div><div class="metric"><span>Memory fixture rows</span><strong>100</strong></div><div class="metric"><span>Played · fixture total</span><strong>${fixture.reduce((n,v)=>n+v.played,0)}</strong></div><div class="metric"><span>Completed · fixture total</span><strong>${fixture.reduce((n,v)=>n+v.finished,0)}</strong></div></div><p class="note">Existing Games family cards and exact aggregate cohorts remain; numbers here are illustrative.</p><div class="card family-card"><h2>Memory</h2><p>100 simulated slots · 4 existing Memory variants · see paged family detail</p><button type="button" class="btn" data-family="memory">Open Memory</button></div><div class="card family-card"><h2>Block · Connect</h2><p>Existing families remain unchanged. No expansion in this milestone.</p></div>`:family!=='memory'?'<div class="card"><h2>Existing family</h2><p>Block and Connect are unchanged. Their future matrices remain unpopulated.</p></div>':`<section><h2>Memory <span class="status">Enabled</span></h2>${tabs([['statistics','Statistics'],['scoring','Scoring'],['settings','Settings']],tab,'tab')}<div class="card"><h2>${tab==='settings'?'Settings':tab==='scoring'?'Scoring':'Statistics'}</h2><p>${tab==='statistics'?'Registered starts remain separate from imported guest completions. Exact family totals do not change when a page changes.':tab==='scoring'?'Existing live scoring editors and complete rollback versions load on this tab only.':'Existing audited lifecycle controls stay in place. No fixture writes are possible.'}</p>${tab==='statistics'?`${table(history.slice(historyPage*size,(historyPage+1)*size))}${pager(historyPage,history.length,'history')}`:''}</div><div class="card"><h2>Variants · ${family==='memory'?100:4} fixture rows</h2><p class="note">Showing a bounded page; disabled and never-played rows remain reachable. Inspect loads one selected detail.</p>${state==='failure'?'<div class="alert" role="alert">Variant list unavailable. Your place is preserved. <button type="button" class="btn" data-retry-list>Retry</button></div>':state==='empty'?'<div class="empty" role="status">No variants on this page. <button type="button" class="btn" data-first>Return to first page</button></div>':`${fixture.slice(page*size,(page+1)*size).map(row).join('')}${pager(page,fixture.length,'list')}`}</div><div class="card"><h2>Test play</h2><p>Still available on the family page; uses live scoring values without loading every historical version.</p><button type="button" class="btn" disabled>Start test round · fixture only</button></div></section>`)};}
function detail(){if(!selected)return;const item=fixture.find(r=>r.id===selected);if(!item)return;const state=scenario.value;drawerBody.innerHTML=`<div class="detail"><p class="note">Memory · selected detail, loaded on demand</p><h2 id="drawer-title">${item.name}</h2><code>${item.id}</code><p><span class="status ${item.state==='Disabled'?'off':''}">${item.state}</span></p>${loading==='loading'?'<p role="status">Loading variant detail…</p>':loading==='failed'?'<div class="alert" role="alert">Details unavailable. Your list and page are unchanged. <button type="button" class="btn" data-retry-detail>Retry details</button></div>':`<h3>Telemetry</h3><p>Shown ${item.shown} · Played ${item.played} · Finished ${item.finished} · Imported 0</p><p class="note">Help, scoring link and existing keyboard/focus handling stay in the production drawer.</p><button type="button" class="btn" data-scoring>View scoring</button><h3>Rules-group history</h3>${item.shown===0?'<div class="empty">No history yet for this variant.</div>':`${table(history.slice(detailPage*size,(detailPage+1)*size))}${pager(detailPage,history.length,'detail-history')}`}`}</div>`;if(state==='detail-failure'&&loading===null){loading='failed';detail()}}
function inspect(id,button){selected=id;trigger=button;detailPage=0;loading='loading';detail();drawer.showModal();setTimeout(()=>{if(!drawer.open||selected!==id||scenario.value==='detail-loading')return;loading=scenario.value==='detail-failure'?'failed':null;detail()},350)}
main.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.family){family=button.dataset.family;tab='statistics';page=0;historyPage=0;render()}else if(button.dataset.tab){tab=button.dataset.tab;historyPage=0;render()}else if(button.dataset.page){const position=[...button.parentNode.querySelectorAll('button')].indexOf(button),label=button.parentNode.getAttribute('aria-label');const n=Number(button.dataset.index);if(button.dataset.page==='list')page=n;else historyPage=n;render();main.querySelectorAll(`nav[aria-label="${label}"] button`)[position]?.focus()}else if(button.dataset.inspect)inspect(button.dataset.inspect,button);else if(button.dataset.retryList){scenario.value='normal';render()}else if(button.dataset.first!==undefined){scenario.value='normal';page=0;render()}});
drawer.addEventListener('click',e=>{const button=e.target.closest('button');if(button?.dataset.retryDetail!==undefined){loading=null;scenario.value='normal';detail()}else if(button?.dataset.scoring!==undefined){drawer.close();tab='scoring';render();main.querySelector('[data-tab="scoring"]')?.focus()}else if(button?.dataset.page==='detail-history'){const position=[...button.parentNode.querySelectorAll('button')].indexOf(button);detailPage=Number(button.dataset.index);detail();drawer.querySelectorAll('[data-page="detail-history"]')[position]?.focus()}});
let backdropStart=false;
function onBackdrop(event){const r=drawer.getBoundingClientRect();return event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom}
drawer.addEventListener('pointerdown',e=>{backdropStart=e.target===drawer&&onBackdrop(e)});
drawer.addEventListener('pointerup',e=>{if(backdropStart&&e.target===drawer&&onBackdrop(e))drawer.close();backdropStart=false});
drawer.addEventListener('close',()=>{selected=null;loading=null;if(trigger?.isConnected)trigger.focus();trigger=null});document.getElementById('close').onclick=()=>drawer.close();scenario.onchange=()=>{page=0;historyPage=0;render()};render();
</script>
</body>
</html>
