<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Morphi v1.3.5.10 — Batch C 10 Network & Cybernetic Protocol Ruleset Variants (Fixture Preview)</title>
<style>
:root {
	font: 600 14px/1.4 'Nunito Variable', 'Nunito', system-ui, sans-serif;
	color: #1b2433;
	background: #eef2f7;
	--board: #dfe9f5;
	--edge: #8fa9c8;
	--back: #a8bfde;
	--focus: #2f6fed;
	--accent: #2563eb;
	--cache: #06b6d4;
	--quantum: #8b5cf6;
	--ratelimit: #ef4444;
	--buffer: #10b981;
	--firewall: #f59e0b;
	--anycast: #3b82f6;
	--tls: #6366f1;
	--trace: #ec4899;
	--bitrot: #d97706;
	--burst: #14b8a6;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; background: #eef2f7; color: #1b2433; }
button {
	font: inherit;
	color: inherit;
	cursor: pointer;
	border: 1px solid #c9d6e4;
	border-radius: 8px;
	background: #fff;
	padding: 6px 12px;
	transition: background-color 0.15s, border-color 0.15s;
}
button:hover { background: #f1f5f9; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.review-banner {
	padding: 8px 14px;
	background: #fff;
	border-bottom: 1px solid #c9d6e4;
	font-size: 12px;
	display: flex;
	justify-content: space-between;
	align-items: center;
	flex-wrap: wrap;
	gap: 6px;
}
.review-banner strong { color: #0284c7; }
.badge {
	font-size: 11px;
	padding: 2px 6px;
	border-radius: 4px;
	background: #e2e8f0;
	color: #475569;
	font-weight: 700;
}

.tabs-bar {
	display: flex;
	flex-wrap: wrap;
	gap: 4px;
	padding: 6px 14px;
	background: #f8fafc;
	border-bottom: 1px solid #c9d6e4;
}
.tabs-bar button {
	font-size: 12px;
	white-space: nowrap;
	padding: 5px 9px;
	background: #fff;
	color: #334155;
	border-color: #cbd5e1;
}
.tabs-bar button[aria-current="page"] {
	background: #1b2433;
	color: #fff;
	font-weight: 800;
	border-color: #1b2433;
}

.container {
	display: grid;
	grid-template-columns: minmax(0, 1fr) 340px;
	flex: 1;
	min-height: 0;
	background: var(--board);
}
@media (max-width: 900px) {
	.container {
		grid-template-columns: 1fr;
		grid-template-rows: minmax(360px, 1fr) auto;
	}
}

.stage-pane {
	padding: 12px;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: space-between;
	gap: 8px;
	min-height: 0;
	position: relative;
}

.hud {
	display: flex;
	justify-content: center;
	align-items: center;
	gap: 14px;
	flex-wrap: wrap;
	font-size: 13px;
	font-weight: 800;
	background: #ffffffea;
	padding: 6px 16px;
	border-radius: 20px;
	border: 1px solid #c9d6e4;
	min-height: 36px;
	box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}

.board-container {
	flex: 1;
	display: grid;
	place-items: center;
	width: 100%;
	min-height: 0;
}
.board {
	display: grid;
	gap: 6px;
	justify-content: center;
	align-content: center;
	position: relative;
}

.card {
	width: var(--size, 64px);
	height: var(--size, 64px);
	background: var(--back);
	border: 2px solid var(--edge);
	border-radius: 10px;
	display: grid;
	place-items: center;
	position: relative;
	user-select: none;
	transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
}
.card.flipped {
	background: #fff;
	border-color: #3b82f6;
	transform: scale(1.03);
	box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
}
.card.matched {
	background: #f1f5f9;
	border-color: #cbd5e1;
	opacity: 0.25;
	pointer-events: none;
}
.card.locked {
	background: #fee2e2;
	border-color: #ef4444;
	opacity: 0.6;
	pointer-events: none;
}
.card.firewall-shield {
	background: #fef3c7;
	border-color: #f59e0b;
	box-shadow: inset 0 0 10px rgba(245, 158, 11, 0.4);
	pointer-events: none;
}
.card.cached-ghost:not(.flipped):not(.matched) {
	background: #ecfeff;
	border-color: #06b6d4;
	box-shadow: 0 0 8px rgba(6, 182, 212, 0.35);
}
.card.cached-ghost .ghost-icon {
	opacity: 0.45;
	filter: grayscale(40%);
}
.card.quantum-node {
	border-color: var(--quantum);
	box-shadow: 0 0 8px rgba(139, 92, 246, 0.4);
}
.card.burst-flash {
	background: #fff !important;
	border-color: #14b8a6 !important;
	box-shadow: 0 0 14px rgba(20, 184, 166, 0.6) !important;
	transform: scale(1.04);
}
.card.bitrot-glitch {
	border-color: #d97706;
	animation: glitchShake 0.3s ease infinite alternate;
}
@keyframes glitchShake {
	from { transform: translateX(-1px); }
	to { transform: translateX(1px); }
}

.card-icon {
	font-size: calc(var(--size, 64px) * 0.46);
	line-height: 1;
}

.status-pill {
	position: absolute;
	top: -6px;
	right: -6px;
	font-size: 9px;
	font-weight: 800;
	padding: 1px 4px;
	border-radius: 4px;
	color: #fff;
	z-index: 2;
}
.pill-cache { background: var(--cache); color: #000; }
.pill-quantum { background: var(--quantum); }
.pill-firewall { background: var(--firewall); color: #000; }
.pill-tls { background: var(--tls); }
.pill-quarantine { background: #ef4444; }

.buffer-hud-slot {
	display: flex;
	align-items: center;
	gap: 6px;
	background: #ecfdf5;
	border: 1px dashed #10b981;
	border-radius: 8px;
	padding: 2px 8px;
	font-size: 12px;
	color: #065f46;
}

.details-pane {
	background: #fff;
	border-left: 1px solid #c9d6e4;
	padding: 16px;
	overflow-y: auto;
	display: flex;
	flex-direction: column;
	gap: 12px;
}
.details-pane h2 {
	margin: 0;
	font-size: 16px;
	display: flex;
	align-items: center;
	gap: 8px;
	color: #0f172a;
}
.details-pane p { margin: 0; font-size: 13px; color: #475569; }
.meta-table {
	width: 100%;
	border-collapse: collapse;
	font-size: 12px;
	margin-top: 4px;
}
.meta-table th, .meta-table td {
	text-align: left;
	padding: 5px 6px;
	border-bottom: 1px solid #f1f5f9;
}
.meta-table th { color: #64748b; font-weight: 600; width: 40%; }
.meta-table td { color: #1e293b; }
.rule-box {
	background: #f8fafc;
	border: 1px solid #e2e8f0;
	border-radius: 8px;
	padding: 10px;
	font-size: 12px;
}
.rule-box strong { color: #0f172a; display: block; margin-bottom: 4px; }

@media (max-height: 500px) {
	.review-banner { display: none; }
	.tabs-bar { padding: 4px 8px; }
	.tabs-bar button { padding: 3px 6px; font-size: 11px; }
	.hud { font-size: 11px; padding: 2px 8px; min-height: 28px; }
}
@media (prefers-reduced-motion: reduce) {
	* { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="review-banner" id="banner">
	<div><strong>FIXTURE ONLY (v1.3.5.10 Batch C)</strong> · 10 Network & Cybernetic Protocol Rulesets · Standard Morphi Theme</div>
	<div><span class="badge">Responsive Review: 390×844 · 844×390 · 1280×800</span></div>
</div>

<nav class="tabs-bar" id="tabs" aria-label="Batch C 10 Network & Cybernetic Protocol Ruleset Variants"></nav>

<div class="container">
	<div class="stage-pane" id="stage">
		<div class="hud" id="hud"></div>
		<div class="board-container">
			<div class="board" id="board" role="grid" aria-label="Memory Card Board"></div>
		</div>
		<div style="font-size:12px;color:#64748b;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;">
			<span id="hint"></span>
			<button type="button" id="reset-btn" style="padding:3px 8px;font-size:11px;">Reset Round</button>
		</div>
	</div>

	<aside class="details-pane" id="details">
		<h2 id="detail-title"></h2>
		<p id="detail-desc"></p>
		<div class="rule-box">
			<strong>Brand New Gameplay Rule:</strong>
			<span id="detail-rule"></span>
		</div>
		<table class="meta-table">
			<tr><th>Mechanic</th><td id="detail-mechanic"></td></tr>
			<tr><th>Baseline</th><td id="detail-baseline"></td></tr>
			<tr><th>Win / Loss Condition</th><td id="detail-win-loss"></td></tr>
			<tr><th>Scoring Model</th><td id="detail-scoring"></td></tr>
			<tr><th>Leaderboard</th><td id="detail-groups"></td></tr>
		</table>
	</aside>
</div>

<script>
const VARIANTS = [
	{
		id: 'memory:edge-cache',
		name: 'Edge Cache',
		mechanic: 'Ephemeral Ghost Cache Imprint',
		baseline: 'memory:classic',
		rule: 'When an inspected card flips face-down after a mismatch, it leaves an ephemeral ghost cache imprint visible on its card back for 2 subsequent player turns. Mismatches purge the cache after 2 turns.',
		winLoss: 'Standard full board clear.',
		scoring: 'Standard brief-v1 + cache-hit recall bonus.',
		groups: 'memory-1:edge-cache:<6|8|10>',
		desc: 'CDN caching memory aid: capitalize on temporary cached imprints before TTL expiration.'
	},
	{
		id: 'memory:quantum-entangle',
		name: 'Quantum Entangle',
		mechanic: 'Simultaneous Twin Node Reveal',
		baseline: 'memory:classic',
		rule: 'One designated card pair is Quantum Entangled (⚛️). Flipping one entangled node automatically and instantaneously flips its entangled twin node face-up on the board, revealing both at once!',
		winLoss: 'Standard full board clear.',
		scoring: 'Standard brief-v1.',
		groups: 'memory-1:quantum-entangle:<6|8|10>',
		desc: 'Synchronous information: entangled nodes bridge spatial distance and expose pairs together.'
	},
	{
		id: 'memory:rate-limiter',
		name: 'Rate Limiter',
		mechanic: '429 Cooldown Backoff Penalty',
		baseline: 'memory:classic',
		rule: 'Frantic clicks or 3 consecutive rapid mismatches triggers a "429 Too Many Requests" Rate Limit lockdown: board interaction locks for 2.5 seconds with cooldown backoff. Deliberate moves keep latency zero.',
		winLoss: 'Standard full board clear.',
		scoring: 'Throughput multiplier (penalties deducted on rate limit lockouts).',
		groups: 'memory-1:rate-limiter:<6|8|10>',
		desc: 'Anti-spam discipline: punish rushed guessing with mandatory edge rate-limiting backoffs.'
	},
	{
		id: 'memory:register-buffer',
		name: 'Register Buffer',
		mechanic: '1-Slot Asymmetric Pairing Buffer',
		baseline: 'memory:classic',
		rule: 'You have a dedicated 1-slot Data Buffer register. When flipping a single card, you can stash it in your buffer. Later, flipping its match anywhere on the board pairs directly with the buffered card without re-flipping!',
		winLoss: 'Standard full board clear.',
		scoring: 'Buffer utilization efficiency bonus.',
		groups: 'memory-1:register-buffer:<6|8|10>',
		desc: 'Asymmetric memory stash: hold a known card in reserve until its partner appears.'
	},
	{
		id: 'memory:firewall-ice',
		name: 'Firewall ICE',
		mechanic: 'Perimeter Barrier & Neighbor Unblock',
		baseline: 'memory:classic',
		rule: 'Two high-value center cells are encased behind an ICE Firewall barrier and cannot be flipped. Matching any orthogonal adjacent card breaches the firewall shield and unlocks the protected nodes!',
		winLoss: 'Standard full board clear.',
		scoring: 'Standard brief-v1 + ICE firewall breach bonus.',
		groups: 'memory-1:firewall-ice:<6|8|10>',
		desc: 'Spatial gatekeeping: clear peripheral nodes to puncture the central firewall security barrier.'
	},
	{
		id: 'memory:anycast-route',
		name: 'Anycast Route',
		mechanic: 'Clockwise Perimeter Re-Route Shift',
		baseline: 'memory:classic',
		rule: 'Every 3rd mismatch triggers an Anycast Route Rebalance: all remaining cards along the outer perimeter shift 1 step clockwise around the grid perimeter, while center cards remain stationary.',
		winLoss: 'Standard full board clear across shifting perimeter routing.',
		scoring: 'Standard brief-v1.',
		groups: 'memory-1:anycast-route:<6|8|10>',
		desc: 'Dynamic perimeter circulation: adapt memory as outer routing paths rotate.'
	},
	{
		id: 'memory:tls-handshake',
		name: 'TLS Handshake',
		mechanic: '3-Way SYN / SYN-ACK / ACK Triad Protocol',
		baseline: 'memory:classic',
		rule: 'Cards feature cryptographic session ciphers: SYN (Client Hello), SYN-ACK (Server Hello), and ACK (Established). Matches require completing the full 3-card cryptographic handshake in triad sequence!',
		winLoss: 'Establish all cryptographic session handshakes.',
		scoring: 'Cryptographic triad handshake scoring model.',
		groups: 'memory-1:tls-handshake:<6|8|10>',
		desc: 'Protocol depth: expand matching into 3-phase security handshake verifications.'
	},
	{
		id: 'memory:trace-route',
		name: 'Security Trace',
		mechanic: 'Escalating Trace & Quarantine Lockdown',
		baseline: 'memory:classic',
		rule: 'Each mismatch advances an active network Security Trace by 15%. If Trace reaches 100%, an alarm triggers and 2 random cards enter Encrypted Quarantine (locked for 3 turns). Clean matches reduce Trace by 10%.',
		winLoss: 'Standard full board clear before permanent system lockdown.',
		scoring: 'Stealth efficiency multiplier (bonus for keeping trace below 30%).',
		groups: 'memory-1:trace-route:<6|8|10>',
		desc: 'Intrusion countermeasure: balance bold discovery against escalating security traces.'
	},
	{
		id: 'memory:bit-rot',
		name: 'Bit-Rot',
		mechanic: 'Stale-Card Neighbor Transposition',
		baseline: 'memory:classic',
		rule: 'Cards that have been inspected face-down begin to suffer data corruption (bit-rot). If a revealed card sits unmatched for 3 consecutive subsequent turns, it swaps positions with its nearest neighbor!',
		winLoss: 'Standard full board clear before data rot scrambles the board.',
		scoring: 'Standard brief-v1.',
		groups: 'memory-1:bit-rot:<6|8|10>',
		desc: 'Entropy pressure: act on inspected cards before bit-rot corruption displaces them.'
	},
	{
		id: 'memory:burst-transmission',
		name: 'Burst Uplink',
		mechanic: 'Consecutive Match High-Speed Ping Flash',
		baseline: 'memory:classic',
		rule: 'Scoring 2 consecutive matches triggers an instantaneous Packet Burst: a transmission ping illuminates 3 random unrevealed face-down cards for 0.8 seconds, exposing their contents before fading back into the grid.',
		winLoss: 'Standard full board clear.',
		scoring: 'High-throughput velocity multiplier (`base * burstStreak`).',
		groups: 'memory-1:burst-transmission:<6|8|10>',
		desc: 'Momentum rewards: chain matches to trigger edge packet bursts that illuminate hidden nodes.'
	}
];

const ICONS = ['🌐', '🔒', '⚡', '💻', '🛰️', '📡', '🔑', '🛡️', '📦', '💾'];
const TLS_CIPHERS = ['AES', 'CHACHA', 'RSA', 'ECC'];

let activeIndex = 0;
let state = null;
let rateLimitTimer = null;

function initTabs() {
	const tabs = document.getElementById('tabs');
	tabs.innerHTML = '';
	VARIANTS.forEach((v, idx) => {
		const btn = document.createElement('button');
		btn.type = 'button';
		btn.textContent = `${idx + 31}. ${v.name}`;
		if (idx === activeIndex) btn.setAttribute('aria-current', 'page');
		btn.addEventListener('click', () => {
			activeIndex = idx;
			document.querySelectorAll('.tabs-bar button').forEach((b, i) => {
				if (i === idx) b.setAttribute('aria-current', 'page');
				else b.removeAttribute('aria-current');
			});
			setupVariant(activeIndex);
		});
		tabs.appendChild(btn);
	});
}

function updateDetails(v) {
	document.getElementById('detail-title').textContent = `${activeIndex + 31}. ${v.name}`;
	document.getElementById('detail-desc').textContent = v.desc;
	document.getElementById('detail-rule').textContent = v.rule;
	document.getElementById('detail-mechanic').textContent = v.mechanic;
	document.getElementById('detail-baseline').textContent = v.baseline;
	document.getElementById('detail-win-loss').textContent = v.winLoss;
	document.getElementById('detail-scoring').textContent = v.scoring;
	document.getElementById('detail-groups').textContent = v.groups;
}

function createRng(seed) {
	let s = seed >>> 0;
	return () => {
		s = (Math.imul(1664525, s) + 1013904223) >>> 0;
		return (s >>> 0) / 4294967296;
	};
}

function setupVariant(index) {
	const v = VARIANTS[index];
	updateDetails(v);

	const rng = createRng(1337 + index * 42);
	const numPairs = v.id === 'memory:tls-handshake' ? 4 : 8; // TLS uses 4 triads (12 cards), others use 8 pairs (16 cards)
	const totalCards = v.id === 'memory:tls-handshake' ? 12 : 16;
	const cols = v.id === 'memory:tls-handshake' ? 4 : 4;
	const rows = totalCards / cols;

	const deck = [];
	if (v.id === 'memory:tls-handshake') {
		for (let i = 0; i < 4; i++) {
			const cipher = TLS_CIPHERS[i];
			deck.push({ id: `c-${i}-syn`, cipher, stage: 'SYN', icon: '🔑', label: `${cipher}: SYN` });
			deck.push({ id: `c-${i}-synack`, cipher, stage: 'SYN-ACK', icon: '🛡️', label: `${cipher}: SYN-ACK` });
			deck.push({ id: `c-${i}-ack`, cipher, stage: 'ACK', icon: '🔒', label: `${cipher}: ACK` });
		}
	} else {
		for (let i = 0; i < numPairs; i++) {
			deck.push({ id: `c-${i}-a`, pairId: i, icon: ICONS[i], label: ICONS[i] });
			deck.push({ id: `c-${i}-b`, pairId: i, icon: ICONS[i], label: ICONS[i] });
		}
	}

	// Deterministic Fisher-Yates shuffle
	for (let i = deck.length - 1; i > 0; i--) {
		const j = Math.floor(rng() * (i + 1));
		[deck[i], deck[j]] = [deck[j], deck[i]];
	}

	state = {
		variantId: v.id,
		cards: deck.map((card, idx) => ({
			...card,
			index: idx,
			flipped: false,
			matched: false,
			cachedTurns: 0,
			cachedIcon: null,
			isQuantum: v.id === 'memory:quantum-entangle' && (card.pairId === 0),
			isFirewall: v.id === 'memory:firewall-ice' && (idx === 5 || idx === 10),
			quarantineTurns: 0,
			staleTurns: 0
		})),
		cols,
		rows,
		flips: 0,
		matches: 0,
		mismatches: 0,
		rapidMismatchCount: 0,
		rateLimited: false,
		rateLimitCooldown: 0,
		bufferCard: null,
		traceMeter: 0,
		consecutiveMatches: 0,
		activeFlipped: [],
		busy: false
	};

	renderHUD();
	renderBoard();
}

function renderHUD() {
	const hud = document.getElementById('hud');
	const v = VARIANTS[activeIndex];
	let extra = '';

	if (v.id === 'memory:edge-cache') {
		const cachedCount = state.cards.filter(c => c.cachedTurns > 0 && !c.matched && !c.flipped).length;
		extra = `<span style="color:var(--cache);">Cache Active: ${cachedCount}</span>`;
	} else if (v.id === 'memory:quantum-entangle') {
		extra = `<span style="color:var(--quantum);">Entangled Pair: ⚛️ Active</span>`;
	} else if (v.id === 'memory:rate-limiter') {
		if (state.rateLimited) {
			extra = `<span style="color:var(--ratelimit);animation:glitchShake 0.2s infinite;">⚠️ 429 RATE LIMITED (${state.rateLimitCooldown}s)</span>`;
		} else {
			extra = `<span style="color:#059669;">Latency: 12ms (Normal)</span>`;
		}
	} else if (v.id === 'memory:register-buffer') {
		extra = `<div class="buffer-hud-slot">
			<strong>Buffer:</strong> ${state.bufferCard ? `<span style="font-size:16px;">${state.bufferCard.icon}</span> [Hold]` : `<em>Empty</em>`}
		</div>`;
	} else if (v.id === 'memory:firewall-ice') {
		const shields = state.cards.filter(c => c.isFirewall).length;
		extra = `<span style="color:var(--firewall);">Firewall Shields: ${shields} Active</span>`;
	} else if (v.id === 'memory:anycast-route') {
		extra = `<span style="color:var(--anycast);">Next Re-route: ${3 - (state.mismatches % 3)} mismatches</span>`;
	} else if (v.id === 'memory:tls-handshake') {
		extra = `<span style="color:var(--tls);">Active Handshakes: ${state.matches} / 4</span>`;
	} else if (v.id === 'memory:trace-route') {
		const color = state.traceMeter > 70 ? '#ef4444' : state.traceMeter > 40 ? '#f59e0b' : '#059669';
		extra = `<span style="color:${color};">Security Trace: ${state.traceMeter}%</span>`;
	} else if (v.id === 'memory:bit-rot') {
		const rotting = state.cards.filter(c => c.staleTurns > 0 && !c.matched).length;
		extra = `<span style="color:var(--bitrot);">Monitored Nodes: ${rotting}</span>`;
	} else if (v.id === 'memory:burst-transmission') {
		extra = `<span style="color:var(--burst);">Streak: ${state.consecutiveMatches} (Next Ping: ${Math.max(0, 2 - state.consecutiveMatches)})</span>`;
	}

	hud.innerHTML = `
		<span>Matches: <strong>${state.matches}</strong></span>
		<span>Flips: <strong>${state.flips}</strong></span>
		${extra}
	`;
	document.getElementById('hint').textContent = state.rateLimited ? 'Rate limited! Please wait for cooldown backoff.' : 'Click any card to flip and test ruleset mechanics.';
}

function calculateCardSize() {
	const stage = document.getElementById('stage');
	const availW = stage.clientWidth - 24;
	const availH = stage.clientHeight - 130;
	const cols = state ? state.cols : 4;
	const rows = state ? state.rows : 4;

	const sizeByW = Math.floor((availW - (cols - 1) * 6) / cols);
	const sizeByH = Math.floor((availH - (rows - 1) * 6) / rows);
	const target = Math.max(38, Math.min(sizeByW, sizeByH, 76));
	return target;
}

function renderBoard() {
	const board = document.getElementById('board');
	board.innerHTML = '';
	board.style.gridTemplateColumns = `repeat(${state.cols}, var(--size))`;
	const size = calculateCardSize();
	document.documentElement.style.setProperty('--size', `${size}px`);

	state.cards.forEach((card, idx) => {
		const el = document.createElement('div');
		el.className = 'card';
		el.setAttribute('role', 'button');
		el.setAttribute('tabindex', card.matched ? '-1' : '0');
		el.setAttribute('aria-label', `Card ${idx + 1}`);

		if (card.matched) el.classList.add('matched');
		if (card.flipped) el.classList.add('flipped');
		if (card.isFirewall) el.classList.add('firewall-shield');
		if (card.isQuantum) el.classList.add('quantum-node');
		if (card.quarantineTurns > 0) el.classList.add('locked');
		if (card.staleTurns >= 2 && !card.matched && !card.flipped) el.classList.add('bitrot-glitch');

		// Edge Cache Ghost Imprint
		if (state.variantId === 'memory:edge-cache' && card.cachedTurns > 0 && !card.flipped && !card.matched) {
			el.classList.add('cached-ghost');
			el.innerHTML = `
				<span class="card-icon ghost-icon">${card.cachedIcon}</span>
				<span class="status-pill pill-cache">CACHE</span>
			`;
		} else if (card.flipped || card.matched) {
			if (state.variantId === 'memory:tls-handshake') {
				el.innerHTML = `
					<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
						<span style="font-size:10px;font-weight:800;color:var(--tls);">${card.stage}</span>
						<span class="card-icon">${card.icon}</span>
						<span style="font-size:9px;color:#64748b;">${card.cipher}</span>
					</div>
				`;
			} else {
				el.innerHTML = `<span class="card-icon">${card.icon}</span>`;
			}
		} else if (card.isFirewall) {
			el.innerHTML = `<span class="card-icon" style="opacity:0.7;">🛡️</span><span class="status-pill pill-firewall">ICE</span>`;
		} else if (card.quarantineTurns > 0) {
			el.innerHTML = `<span class="card-icon" style="opacity:0.6;">🚫</span><span class="status-pill pill-quarantine">LOCK</span>`;
		} else if (card.isQuantum) {
			el.innerHTML = `<span class="status-pill pill-quantum">⚛️</span>`;
		} else {
			el.innerHTML = '';
		}

		// Click / Enter interaction
		const handleAction = () => onCardClick(idx);
		el.addEventListener('click', handleAction);
		el.addEventListener('keydown', (e) => {
			if (e.key === 'Enter' || e.key === ' ') {
				e.preventDefault();
				handleAction();
			}
		});

		board.appendChild(el);
	});
}

function onCardClick(idx) {
	if (state.busy || state.rateLimited) return;
	const card = state.cards[idx];
	if (card.matched || card.flipped || card.isFirewall || card.quarantineTurns > 0) return;

	state.flips++;

	// Rate limiter tracking
	if (state.variantId === 'memory:rate-limiter') {
		// Handled on mismatch
	}

	card.flipped = true;
	state.activeFlipped.push(card);

	// Quantum Entanglement Trigger
	if (state.variantId === 'memory:quantum-entangle' && card.isQuantum) {
		const twin = state.cards.find(c => c.pairId === card.pairId && c.index !== card.index);
		if (twin && !twin.flipped && !twin.matched) {
			twin.flipped = true;
			state.activeFlipped.push(twin);
		}
	}

	renderHUD();
	renderBoard();

	// Check pairing conditions
	if (state.variantId === 'memory:tls-handshake') {
		if (state.activeFlipped.length === 3) {
			state.busy = true;
			setTimeout(resolveTlsHandshake, 850);
		}
	} else if (state.variantId === 'memory:register-buffer' && state.bufferCard) {
		// Can pair immediately with buffered card!
		state.busy = true;
		setTimeout(() => resolveBufferPair(card), 700);
	} else {
		if (state.activeFlipped.length === 2) {
			state.busy = true;
			setTimeout(resolveStandardPair, 750);
		} else if (state.variantId === 'memory:register-buffer' && state.activeFlipped.length === 1) {
			// Offer to stash into buffer if clicked again or after delay
			promptBufferStash(card);
		}
	}
}

function promptBufferStash(card) {
	const hint = document.getElementById('hint');
	hint.innerHTML = `<button type="button" id="stash-btn" style="background:#ecfdf5;border-color:#10b981;color:#065f46;font-size:11px;padding:2px 6px;">📥 Stash ${card.icon} in Buffer</button> or flip 2nd card`;
	const btn = document.getElementById('stash-btn');
	if (btn) {
		btn.addEventListener('click', () => {
			state.bufferCard = card;
			card.matched = true; // removed from active grid
			state.activeFlipped = [];
			renderHUD();
			renderBoard();
		});
	}
}

function resolveBufferPair(card) {
	if (card.pairId === state.bufferCard.pairId) {
		card.matched = true;
		state.matches++;
		state.bufferCard = null;
		state.consecutiveMatches++;
	} else {
		// Mismatch against buffered card: card flips back down, buffer retained
		card.flipped = false;
		state.mismatches++;
		state.consecutiveMatches = 0;
	}
	state.activeFlipped = [];
	state.busy = false;
	advanceTurnDecay();
	renderHUD();
	renderBoard();
}

function resolveStandardPair() {
	const [c1, c2] = state.activeFlipped;
	const isMatch = c1.pairId === c2.pairId;

	if (isMatch) {
		c1.matched = true;
		c2.matched = true;
		state.matches++;
		state.consecutiveMatches++;
		state.rapidMismatchCount = 0;

		// Security Trace reduction
		if (state.variantId === 'memory:trace-route') {
			state.traceMeter = Math.max(0, state.traceMeter - 10);
		}

		// Burst Transmission Ping
		if (state.variantId === 'memory:burst-transmission' && state.consecutiveMatches >= 2) {
			triggerBurstPing();
		}

		// Firewall ICE Breach Check (neighbor matching)
		if (state.variantId === 'memory:firewall-ice') {
			checkFirewallBreach(c1.index, c2.index);
		}
	} else {
		c1.flipped = false;
		c2.flipped = false;
		state.mismatches++;
		state.consecutiveMatches = 0;
		state.rapidMismatchCount++;

		// Edge Cache Imprint
		if (state.variantId === 'memory:edge-cache') {
			c1.cachedTurns = 2;
			c1.cachedIcon = c1.icon;
			c2.cachedTurns = 2;
			c2.cachedIcon = c2.icon;
		}

		// Rate Limiter Trigger
		if (state.variantId === 'memory:rate-limiter' && state.rapidMismatchCount >= 3) {
			triggerRateLimit();
		}

		// Security Trace Escalation
		if (state.variantId === 'memory:trace-route') {
			state.traceMeter = Math.min(100, state.traceMeter + 15);
			if (state.traceMeter >= 100) {
				triggerQuarantine();
			}
		}

		// Bit-Rot Stale Tracker
		if (state.variantId === 'memory:bit-rot') {
			c1.staleTurns++;
			c2.staleTurns++;
			checkBitRotTransposition();
		}

		// Anycast Route Shift
		if (state.variantId === 'memory:anycast-route' && state.mismatches % 3 === 0) {
			triggerAnycastShift();
		}
	}

	state.activeFlipped = [];
	state.busy = false;
	advanceTurnDecay();
	renderHUD();
	renderBoard();
}

function resolveTlsHandshake() {
	const [c1, c2, c3] = state.activeFlipped;
	const sameCipher = c1.cipher === c2.cipher && c2.cipher === c3.cipher;
	const stages = [c1.stage, c2.stage, c3.stage];
	const validTriad = stages.includes('SYN') && stages.includes('SYN-ACK') && stages.includes('ACK');

	if (sameCipher && validTriad) {
		c1.matched = true;
		c2.matched = true;
		c3.matched = true;
		state.matches++;
	} else {
		c1.flipped = false;
		c2.flipped = false;
		c3.flipped = false;
		state.mismatches++;
	}

	state.activeFlipped = [];
	state.busy = false;
	renderHUD();
	renderBoard();
}

function advanceTurnDecay() {
	// Decrement Edge Cache TTL
	state.cards.forEach(c => {
		if (c.cachedTurns > 0) c.cachedTurns--;
		if (c.quarantineTurns > 0) c.quarantineTurns--;
	});
}

function triggerRateLimit() {
	state.rateLimited = true;
	state.rateLimitCooldown = 3;
	state.rapidMismatchCount = 0;
	renderHUD();
	const interval = setInterval(() => {
		state.rateLimitCooldown--;
		if (state.rateLimitCooldown <= 0) {
			clearInterval(interval);
			state.rateLimited = false;
			renderHUD();
		} else {
			renderHUD();
		}
	}, 1000);
}

function triggerQuarantine() {
	const candidates = state.cards.filter(c => !c.matched && !c.flipped && c.quarantineTurns === 0);
	for (let i = 0; i < Math.min(2, candidates.length); i++) {
		candidates[i].quarantineTurns = 3;
	}
	state.traceMeter = 50; // resets partially
}

function checkFirewallBreach(idx1, idx2) {
	// If matched cards are orthogonal neighbors to firewall cells, unlock them
	state.cards.forEach(card => {
		if (card.isFirewall) {
			const isAdj1 = Math.abs(card.index - idx1) === 1 || Math.abs(card.index - idx1) === state.cols;
			const isAdj2 = Math.abs(card.index - idx2) === 1 || Math.abs(card.index - idx2) === state.cols;
			if (isAdj1 || isAdj2) {
				card.isFirewall = false; // breached!
			}
		}
	});
}

function triggerBurstPing() {
	const unrevealed = state.cards.filter(c => !c.matched && !c.flipped);
	const pinged = unrevealed.sort(() => 0.5 - Math.random()).slice(0, 3);
	pinged.forEach(c => c.flipped = true);
	renderBoard();
	setTimeout(() => {
		pinged.forEach(c => {
			if (!c.matched) c.flipped = false;
		});
		renderBoard();
	}, 800);
}

function triggerAnycastShift() {
	// Outer perimeter indices for 4x4: 0,1,2,3, 7,11,15, 14,13,12, 8,4
	const perimeter = [0, 1, 2, 3, 7, 11, 15, 14, 13, 12, 8, 4];
	const firstCard = { ...state.cards[perimeter[0]] };
	for (let i = 0; i < perimeter.length - 1; i++) {
		const curr = perimeter[i];
		const next = perimeter[i + 1];
		state.cards[curr] = { ...state.cards[next], index: curr };
	}
	state.cards[perimeter[perimeter.length - 1]] = { ...firstCard, index: perimeter[perimeter.length - 1] };
}

function checkBitRotTransposition() {
	const rotting = state.cards.filter(c => c.staleTurns >= 3 && !c.matched && !c.flipped);
	if (rotting.length >= 1) {
		const target = rotting[0];
		// Swap with an adjacent card
		const adjIdx = (target.index + 1) % state.cards.length;
		const swapWith = state.cards[adjIdx];
		if (!swapWith.matched) {
			const temp = { ...target };
			state.cards[target.index] = { ...swapWith, index: target.index };
			state.cards[adjIdx] = { ...temp, index: adjIdx, staleTurns: 0 };
		}
	}
}

document.getElementById('reset-btn').addEventListener('click', () => {
	setupVariant(activeIndex);
});

window.addEventListener('resize', () => {
	const size = calculateCardSize();
	document.documentElement.style.setProperty('--size', `${size}px`);
});

initTabs();
setupVariant(0);
</script>
</body>
